<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barycenter</title>
<meta name="description" content="A private place for two.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="assets/manifests/barycenter.webmanifest">
<link rel="icon" href="assets/icons/barycenter.png">
<link rel="apple-touch-icon" href="assets/icons/barycenter.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barycenter">
<link rel="preload" href="assets/fonts/MentifaberDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
@font-face{font-family:"Mentifaber Display";src:url("assets/fonts/MentifaberDisplay-Regular.woff2") format("woff2");font-display:swap}
:root{--bg:#05060f;--bg2:#0b0d1c;--panel:#10132a;--panel2:#171b38;--line:#252a4d;--ink:#e9ebff;--dim:#9aa0c8;--faint:#6a709c;--me:#7fd8ff;--her:#ffc66b;--sos:#ff4d5e;--ok:#7be0a6;--f-body:"Space Grotesk",system-ui,sans-serif;--f-head:"Space Grotesk",system-ui,sans-serif;--fs:17px;--glass:blur(14px);color-scheme:dark}
:root[data-theme="aurora"]{--bg:#041412;--bg2:#08201c;--panel:#0c2a26;--panel2:#123733;--line:#1f4f48;--ink:#e6fff6;--dim:#8fc9b8;--faint:#5d9486}
:root[data-theme="solar"]{--bg:#0e0705;--bg2:#190d09;--panel:#241410;--panel2:#31201a;--line:#573627;--ink:#fff0e0;--dim:#d0a98c;--faint:#8c6a55}
:root[data-theme="hologram"]{--bg:#03030f;--bg2:#070720;--panel:#0a0a2c;--panel2:#10104a;--line:#2a2a8a;--ink:#e8f4ff;--dim:#8fb8e8;--faint:#5a78b0}
:root[data-theme="terminal"]{--bg:#010a03;--bg2:#03140a;--panel:#052010;--panel2:#08301a;--line:#0f5a2c;--ink:#b8ffc8;--dim:#6fd88c;--faint:#3d9a5a;--f-body:"JetBrains Mono",ui-monospace,monospace;--f-head:"JetBrains Mono",ui-monospace,monospace}
:root[data-theme="glass"]{--bg:#e8eefb;--bg2:#f4f7ff;--panel:#ffffffcc;--panel2:#ffffff;--line:#c6d2ee;--ink:#10173a;--dim:#4a5788;--faint:#7c88b5;--sos:#d4203a;--ok:#1b9e5e;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:var(--fs)/1.5 var(--f-body);overflow:hidden}
#void{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.03em}
.disp{font-family:var(--f-head);font-weight:600;letter-spacing:.06em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--her)}.hidden{display:none!important}
:root[data-theme="hologram"] body::after{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(80,200,255,.05) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
:root[data-theme="terminal"] .disp,:root[data-theme="terminal"] .top .nm{text-transform:uppercase}
:root[data-theme="terminal"] .en .t::before{content:"> ";color:var(--faint)}

/* gate */
#gate{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gc{width:min(440px,100%);padding:26px 22px;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.gc h1{margin:0 0 4px;font-size:34px;text-transform:uppercase}.gc p{color:var(--dim);margin:6px 0 14px}
.gc label,.sheet label{display:block;margin:12px 0 4px;font:11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.gc input,.sheet input[type=text],.sheet input:not([type]),.sheet input[type=datetime-local],.sheet input[type=file],.sheet textarea,.dock textarea,#pq{width:100%;font:inherit;font-size:var(--fs);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}
.gc input:focus,.sheet input:focus,.sheet textarea:focus,#pq:focus{border-color:var(--me)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font:600 13px "JetBrains Mono",monospace;letter-spacing:.06em;white-space:nowrap}
.btn.pri{background:var(--me);border-color:var(--me);color:#04101a}.btn:disabled{opacity:.55}.btn.full{width:100%;margin-top:16px}
.msg{min-height:1.4em;margin-top:10px;font-size:14px;color:var(--dim)}.msg.bad{color:#ff8b98}
.linkbox{word-break:break-all;font:12px/1.5 "JetBrains Mono",monospace;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg2);color:var(--her)}
.mark{display:flex;gap:6px;align-items:center;margin-bottom:12px}.mark i{width:12px;height:12px;border-radius:50%}.mark i:first-child{background:var(--me);box-shadow:0 0 14px var(--me)}.mark i:last-child{background:var(--her);box-shadow:0 0 14px var(--her)}

/* app */
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 4px}
.top .nm{flex:1;font-size:17px;letter-spacing:.16em;text-transform:uppercase;min-width:0}.top .nm small{display:flex;align-items:center;gap:6px;font:10px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--faint);text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ld{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}.ld.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);font-size:17px;flex:none}
#hero{flex:none;position:relative;height:clamp(180px,31vh,290px);touch-action:none;cursor:crosshair;transition:height .3s}
#herocap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:10.5px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--dim);text-shadow:0 0 8px var(--bg),0 0 3px var(--bg);padding:0 12px;pointer-events:none}
#herohint{position:absolute;left:0;right:0;top:12px;text-align:center;font:12px "JetBrains Mono",monospace;color:var(--dim);pointer-events:none;padding:0 20px}
#stagebar{display:none;position:absolute;left:0;right:0;bottom:calc(36px + env(safe-area-inset-bottom));justify-content:center;gap:10px}#stagebar button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 70%,transparent);font-size:22px}
#stage-x{display:none;position:absolute;right:10px;top:8px}
#app.stage #hero{flex:1;height:auto}#app.stage #log,#app.stage .dock,#app.stage #ghost{display:none}#app.stage #stagebar,#app.stage #stage-x{display:flex}
#log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 18px;-webkit-overflow-scrolling:touch;background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 70%,transparent) 26px);perspective:900px;perspective-origin:50% 100%}
.day{position:sticky;top:-15px;z-index:2;text-align:center;margin:14px -14px 8px;padding:12px 0 6px;background:linear-gradient(color-mix(in srgb,var(--bg) 88%,transparent) 62%,transparent);font:10.5px "JetBrains Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}.day span{padding:2px 10px}
.en{position:relative;margin:10px 0;padding:6px 12px;max-width:90%;border-radius:14px;background:color-mix(in srgb,var(--panel) 52%,transparent);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);transform:translateZ(calc(var(--k,0) * -70px));opacity:calc(1 - var(--k,0) * .5);transform-origin:50% 100%;will-change:transform,opacity}
:root[data-density="compact"] .en{margin:5px 0;padding:3px 10px}
.en::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--c,var(--me));box-shadow:0 0 10px var(--c,var(--me))}
.en.me{--c:var(--me)}.en.her{--c:var(--her);margin-left:auto;text-align:right}.en.her::before{left:auto;right:0}
.en.in{animation:arrive .6s cubic-bezier(.2,.9,.2,1)}@keyframes arrive{from{opacity:0;transform:translateY(24px) scale(.94);filter:blur(6px)}}
.en.sos{border-color:var(--sos)}
.en .h{font:10.5px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--faint)}.en .h .back{color:var(--her)}
.en .t{margin:2px 0;white-space:pre-wrap;word-wrap:break-word;font-size:1.05em}
.en .rc{font:10px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--faint)}.en .rc.seen{color:var(--ok)}
.rxs{display:flex;gap:4px;margin-top:3px;justify-content:inherit}.rx{padding:1px 7px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font-size:14px}.rx.mine{border-color:var(--me)}
.en.her .rxs{justify-content:flex-end}
/* an unobserved message is a superposition: blurred and shimmering until someone looks */
.en.q .bd{filter:blur(7px) saturate(1.6);animation:shim 2.2s ease-in-out infinite;transition:filter .6s;cursor:pointer;user-select:none}
.en.q.collapsing .bd{filter:blur(0);animation:none}.en.q{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.en.q.collapsing{animation:snap .6s}@keyframes snap{40%{transform:scale(1.04);box-shadow:0 0 40px var(--c)}}
@keyframes shim{50%{filter:blur(9px) saturate(2) hue-rotate(25deg)}}
.qhint{font:10px "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--c);text-transform:uppercase;margin-top:2px}.en.q.collapsing .qhint{display:none}
.en.flash{animation:fl 1.6s}@keyframes fl{20%,60%{box-shadow:0 0 0 2px var(--me),0 0 30px var(--me)}}
.card{display:inline-block;text-align:left;margin:4px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-width:100%}
.pulse{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--pc) 50%,transparent);background:color-mix(in srgb,var(--pc) 12%,var(--bg2))}
.pulse i{width:22px;height:22px;border-radius:50%;background:var(--pc);box-shadow:0 0 18px var(--pc);animation:glow 3s ease-in-out infinite}.pulse span{font-size:1em}
@keyframes glow{50%{box-shadow:0 0 6px var(--pc);transform:scale(.88)}}
.env{cursor:pointer;display:inline-flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,var(--panel2),var(--panel));text-align:left}
.env b{font-family:var(--f-head);font-weight:600;letter-spacing:.04em;font-size:1.1em;display:block}.env small{font:10.5px "JetBrains Mono",monospace;color:var(--dim);letter-spacing:.06em}
.env .wax{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8b98,#b0243a);box-shadow:0 2px 10px rgba(255,77,94,.4);flex:none}.env.read .wax{background:radial-gradient(circle at 35% 30%,#8a90c0,#3f4577);box-shadow:none}
.cap{display:inline-flex;gap:12px;align-items:center;padding:12px 16px;border:1px dashed var(--faint);border-radius:14px;color:var(--dim);text-align:left}.cap .orb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff,var(--her));box-shadow:0 0 16px var(--her);animation:glow 2.4s infinite;--pc:var(--her)}
.ck{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.ck.sos{border-color:var(--sos);background:color-mix(in srgb,var(--sos) 16%,var(--bg2))}
.drop img{display:block;max-width:min(300px,70vw);max-height:340px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.drop .ph{width:min(260px,60vw);height:160px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--faint);font:11px "JetBrains Mono",monospace}
.voice{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}.voice button{width:36px;height:36px;border-radius:50%;border:0;background:var(--c);color:#04101a;font-size:14px}
.voice .bars{display:flex;gap:2px;align-items:center;height:22px}.voice .bars i{width:3px;background:var(--faint);border-radius:2px}
.more{display:block;margin:6px auto;background:none;border:0;color:var(--faint);font:11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.empty{text-align:center;color:var(--faint);padding:30px 10px;font-style:italic}
.qd{margin:2px 0 10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--panel) 70%,transparent)}
.qd .k{font:10.5px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--her)}.qd h3{margin:4px 0 8px;font-weight:500;font-size:1.15em}
.qd textarea{width:100%;min-height:64px;resize:vertical;font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0}.qd textarea:focus{border-color:var(--me)}
.qd .both{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qd .both div{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);white-space:pre-wrap}.qd .both b{display:block;font:10px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
.qd.fold .body{display:none}.qd .tg{background:none;border:0;color:var(--faint);float:right;font:11px "JetBrains Mono",monospace}
#ghost{flex:none;display:none;margin:0 14px 4px;padding:6px 12px;border-radius:99px;border:1px dashed var(--her);color:var(--her);font:12px "JetBrains Mono",monospace;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;align-self:flex-start}#ghost.on{display:block;animation:shim 1.6s infinite}
/* dock */
.dock{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 82%,transparent) 30%)}
.dock textarea{flex:1;min-height:44px;max-height:132px;resize:none;border-radius:22px;padding:10px 16px;line-height:1.35;background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:var(--glass)}
.dock .ib{border-radius:50%;width:44px;height:44px}.dock .go{background:var(--me);color:#04101a;border-color:var(--me)}.dock .ib.on{border-color:var(--her);box-shadow:0 0 12px color-mix(in srgb,var(--her) 50%,transparent)}
.tray{position:absolute;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:var(--glass);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10}
.tray button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font:10.5px "JetBrains Mono",monospace;letter-spacing:.04em}.tray button b{font-size:22px;font-weight:400}
/* call bar */
#call{display:none;position:absolute;left:10px;right:10px;top:calc(58px + env(safe-area-inset-top));z-index:20;padding:10px 12px;border:1px solid var(--me);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:var(--glass);align-items:center;gap:8px;box-shadow:0 0 30px color-mix(in srgb,var(--me) 30%,transparent)}
#call.on{display:flex}#call-t{flex:1;font:12px "JetBrains Mono",monospace;letter-spacing:.05em}.cb{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font:600 12px "JetBrains Mono",monospace}.cb.go{background:var(--ok);color:#03150b;border-color:var(--ok)}.cb.end{background:var(--sos);color:#fff;border-color:var(--sos)}.cb.on{border-color:var(--sos);color:var(--sos)}
#call.incoming{animation:ringb 1s infinite alternate}@keyframes ringb{to{box-shadow:0 0 44px var(--ok);border-color:var(--ok)}}
/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(2,3,10,.55);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;left:50%;bottom:0;width:min(580px,100%);max-height:90vh;overflow:auto;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:var(--glass);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{margin:0 0 4px;font-size:22px;text-transform:uppercase}.sheet p{color:var(--dim);margin:4px 0 12px}.sheet textarea{min-height:140px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);text-align:left}.opt b{font-size:22px;font-weight:400}.opt.s{border-color:var(--sos)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.mt{margin-top:12px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.setrow small{display:block;color:var(--faint);font-size:.82em;line-height:1.3;max-width:30ch}.setrow .btn{min-height:40px;padding:0 13px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0 12px;padding-bottom:4px}.tabs button{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font:11px "JetBrains Mono",monospace;letter-spacing:.06em}.tabs button.on{background:var(--me);color:#04101a;border-color:var(--me)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font:10.5px "JetBrains Mono",monospace}.tile.on{border-color:var(--me);box-shadow:0 0 14px color-mix(in srgb,var(--me) 40%,transparent)}.tile i{display:inline-block;width:18px;height:18px;border-radius:50%;margin:0 2px}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.seg button{padding:7px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-size:.82em}.seg button.on{background:var(--me);color:#04101a;border-color:var(--me)}
.tg2{width:50px;height:28px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);position:relative;flex:none}.tg2 i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--faint);transition:.2s}.tg2.on{background:color-mix(in srgb,var(--me) 35%,var(--bg2));border-color:var(--me)}.tg2.on i{left:25px;background:var(--me)}
input[type=range]{width:140px;accent-color:var(--me)}
.note{font-size:.85em;color:var(--dim)}
.sys div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font:12px "JetBrains Mono",monospace}.sys span{color:var(--faint)}.sys b{font-weight:400;text-align:right}
.fp{text-align:center;margin-bottom:10px}.fp canvas{width:100%;max-width:320px;border-radius:14px;border:1px solid var(--line)}.fp .mono{font-size:15px;margin:8px 0 2px;color:var(--her)}.fp small{display:block;color:var(--faint);font-size:.8em}
/* reader, SOS, toast, palette, reaction bar */
#reader{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:var(--glass);overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 22px 40px;display:none}
#reader.on{display:block}.paper{max-width:560px;margin:0 auto}.paper h2{font-family:var(--f-head);font-size:30px;margin:6px 0 16px}.paper .body{white-space:pre-wrap;font-size:1.25em;line-height:1.7}.paper .by{margin-top:26px;font:11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--faint)}
#sos{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px;background:radial-gradient(circle,#4a0b17,#12030a);animation:sosb 1.2s infinite alternate;color:#fff}
#sos.on{display:flex}@keyframes sosb{to{background:radial-gradient(circle,#7a0f22,#1a0309)}}#sos h1{margin:0;font-size:clamp(34px,9vw,60px);text-transform:uppercase}#sos p{font-size:20px;color:#ffd0d6;max-width:480px;white-space:pre-wrap}
#sos .btn{background:#fff;color:#4a0b17;border:0;font-size:18px;min-height:64px;padding:0 40px;border-radius:32px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;padding:10px 16px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font:12px "JetBrains Mono",monospace;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
#pal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:calc(70px + env(safe-area-inset-top)) 12px 0;background:rgba(2,3,10,.55);backdrop-filter:blur(4px)}
#pal.on{display:flex}.palc{width:min(560px,100%);border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 96%,transparent);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#pq{border-radius:0;border:0;border-bottom:1px solid var(--line);padding:16px}#pl{max-height:50vh;overflow:auto}.pi{display:block;width:100%;text-align:left;padding:11px 16px;border:0;background:none;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pi.s,.pi:hover{background:color-mix(in srgb,var(--me) 18%,transparent)}.pi.m{color:var(--dim)}
#pall{display:block;width:100%;padding:10px;border:0;border-top:1px solid var(--line);background:none;color:var(--faint);font:11px "JetBrains Mono",monospace}
#rxbar{position:fixed;z-index:45;display:none;gap:2px;padding:6px;border-radius:99px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 96%,transparent);backdrop-filter:var(--glass);box-shadow:0 8px 30px rgba(0,0,0,.5)}#rxbar.on{display:flex}#rxbar button{width:38px;height:38px;border:0;background:none;font-size:21px;border-radius:50%}
@media (prefers-reduced-motion:reduce){.en.q .bd,.pulse i,#ghost.on,#sos{animation:none}.en.in{animation:none}}
</style>
</head>
<body>
<canvas id="void" aria-hidden="true"></canvas>

<div id="gate"><div class="gc" id="gc"><div class="mark" aria-hidden="true"><i></i><i></i></div><h1 class="disp">Barycenter</h1><p>…</p></div></div>

<div id="app" class="hidden">
  <div class="top">
    <div class="nm disp" id="pn">Barycenter<small id="pst"></small></div>
    <button class="ib" id="b-pal" aria-label="Search and commands" title="Search & commands (Ctrl/⌘ K)">⌕</button>
    <button class="ib" id="b-stage" aria-label="Touch the void together" title="Stage: touch together">◎</button>
    <button class="ib" id="b-set" aria-label="Settings">⚙</button>
  </div>
  <div id="call"><span id="call-t"></span><span id="call-a" class="row"><button class="cb go" id="call-yes">Answer</button><button class="cb" id="call-no">Decline</button></span><button class="cb" id="call-mute">Mute</button><button class="cb end" id="call-end">End</button></div>
  <div id="hero" aria-label="The void between you. Touch it."><div id="herohint"></div><div id="herocap" aria-live="polite"></div><button class="ib" id="stage-x" aria-label="Leave the stage">✕</button><div id="stagebar"></div></div>

    <button class="ib" id="b-loud" aria-pressed="false" aria-label="Alert mode">🔔</button>

</div>

<div id="sos"><div style="font-size:64px">🚨</div><h1 class="disp" id="sos-h"></h1><p id="sos-p"></p><button class="btn" id="sos-ok">I'm here</button></div>
<div id="pal"><div class="palc"><input id="pq" placeholder="Search everything, or type a command…" autocomplete="off" aria-label="Search"><div id="pl"></div><button id="pall" class="hidden">Search everything we've ever said</button></div></div>
<div id="rxbar"></div>
<div id="toast" role="status"></div>
