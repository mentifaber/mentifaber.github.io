<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Barycenter</title>
<meta name="description" content="A private place for two.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05060f">
<link rel="manifest" href="assets/manifests/barycenter.webmanifest">
<link rel="icon" href="assets/icons/barycenter.png">
<link rel="apple-touch-icon" href="assets/icons/barycenter.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barycenter">
<link rel="preload" href="assets/fonts/MentifaberDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Mentifaber Display";src:url("assets/fonts/MentifaberDisplay-Regular.woff2") format("woff2");font-display:swap}
:root{--bg:#05060f;--bg2:#0b0d1c;--panel:#10132a;--panel2:#171b38;--line:#252a4d;--ink:#e9ebff;--dim:#9aa0c8;--faint:#5e6490;--me:#7fd8ff;--her:#ffc66b;--sos:#ff4d5e;--ok:#7be0a6;color-scheme:dark}
:root[data-theme="dawn"]{--bg:#140f1c;--bg2:#1c1428;--panel:#251a33;--panel2:#2f2140;--line:#44305c;--ink:#fff1ea;--dim:#d0b4c4;--faint:#8c6f86}
:root[data-theme="ember"]{--bg:#0d0807;--bg2:#160e0b;--panel:#201410;--panel2:#2b1b15;--line:#4a2f24;--ink:#ffeedd;--dim:#c9a98f;--faint:#80604d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "EB Garamond",Georgia,serif;overflow:hidden}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.03em}
.disp{font-family:"Mentifaber Display",Georgia,serif;font-weight:400;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--her)}
.hidden{display:none!important}

/* ── gate: setup · invite · sign in ── */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(120% 90% at 50% 0%,#141842 0%,var(--bg) 60%);overflow:auto}
.gc{width:min(440px,100%);padding:26px 22px;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(10px)}
.gc h1{margin:0 0 4px;font-size:34px;text-transform:uppercase}.gc p{color:var(--dim);margin:6px 0 14px}
.gc label{display:block;margin:12px 0 4px;font:11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.gc input,.sheet input,.sheet textarea,.dock textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:0}
.gc input:focus,.sheet input:focus,.sheet textarea:focus{border-color:var(--me)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);font:600 13px "JetBrains Mono",monospace;letter-spacing:.06em}
.btn{white-space:nowrap}.btn.pri{background:var(--me);border-color:var(--me);color:#04101a}.btn:disabled{opacity:.55}.btn.full{width:100%;margin-top:16px}
.msg{min-height:1.4em;margin-top:10px;font-size:14px;color:var(--dim)}.msg.bad{color:#ff8b98}
.linkbox{word-break:break-all;font:12px/1.5 "JetBrains Mono",monospace;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--bg2);color:var(--her)}
.mark{display:flex;gap:6px;align-items:center;margin-bottom:12px}.mark i{width:12px;height:12px;border-radius:50%}.mark i:first-child{background:var(--me);box-shadow:0 0 14px var(--me)}.mark i:last-child{background:var(--her);box-shadow:0 0 14px var(--her)}

/* ── the app ── */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto;background:var(--bg)}
@media (min-width:780px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{flex:none;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
.top .nm{flex:1;font-size:18px;letter-spacing:.14em;text-transform:uppercase}.top .nm small{display:block;font:10px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--faint);text-transform:none}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:18px}
.ib.dot::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--sos);transform:translate(13px,-13px)}
#skyw{flex:none;position:relative;height:clamp(190px,34vh,300px);overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:radial-gradient(80% 120% at 50% 40%,#141a4a 0%,var(--bg) 70%)}
#sky{position:absolute;inset:0;width:100%;height:100%}
#skycap{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:10.5px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--dim);text-shadow:0 0 8px #000;padding:0 12px;pointer-events:none}
#log{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 14px 18px;-webkit-overflow-scrolling:touch}
.day{position:sticky;top:-11px;z-index:2;text-align:center;margin:14px -14px 8px;padding:10px 0 6px;background:linear-gradient(var(--bg) 62%,transparent);font:10.5px "JetBrains Mono",monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.day span{padding:2px 10px}
.en{position:relative;margin:10px 0;padding:2px 0 2px 14px;max-width:92%}
.en::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;border-radius:2px;background:var(--c,var(--me))}
.en.me{--c:var(--me)}.en.her{--c:var(--her);margin-left:auto;padding:2px 14px 2px 0;text-align:right}
.en.her::before{left:auto;right:0}
.en .h{font:10.5px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--faint)}
.en .t{margin:2px 0;white-space:pre-wrap;word-wrap:break-word;font-size:18px}
.en .rc{font:10px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--faint)}.en .rc.seen{color:var(--ok)}
.card{display:inline-block;text-align:left;margin:4px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-width:100%}
.pulse{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:99px;border:1px solid color-mix(in srgb,var(--pc) 50%,transparent);background:color-mix(in srgb,var(--pc) 12%,var(--bg2))}
.pulse i{width:22px;height:22px;border-radius:50%;background:var(--pc);box-shadow:0 0 18px var(--pc);animation:glow 3s ease-in-out infinite}.pulse span{font-style:italic;font-size:17px}
@keyframes glow{50%{box-shadow:0 0 6px var(--pc);transform:scale(.88)}}
.env{cursor:pointer;display:inline-flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,var(--panel2),var(--panel))}
.env b{font-family:"Mentifaber Display";font-weight:400;letter-spacing:.06em;font-size:19px;display:block}.env small{font:10.5px "JetBrains Mono",monospace;color:var(--dim);letter-spacing:.08em}
.env .wax{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8b98,#b0243a);box-shadow:0 2px 10px rgba(255,77,94,.4);flex:none}
.env.read .wax{background:radial-gradient(circle at 35% 30%,#8a90c0,#3f4577);box-shadow:none}
.cap{display:inline-flex;gap:12px;align-items:center;padding:12px 16px;border:1px dashed var(--faint);border-radius:14px;color:var(--dim)}.cap .orb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff,var(--her));box-shadow:0 0 16px var(--her);animation:glow 2.4s infinite;--pc:var(--her)}
.ck{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.ck.sos{border-color:var(--sos);background:color-mix(in srgb,var(--sos) 16%,var(--bg2))}
.drop img{display:block;max-width:min(300px,70vw);max-height:340px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.drop .ph{width:min(260px,60vw);height:160px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--faint);font:11px "JetBrains Mono",monospace}
.voice{display:inline-flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:99px;border:1px solid var(--line);background:var(--panel)}.voice button{width:36px;height:36px;border-radius:50%;border:0;background:var(--c);color:#04101a;font-size:14px}
.voice .bars{display:flex;gap:2px;align-items:center;height:22px}.voice .bars i{width:3px;background:var(--faint);border-radius:2px}
.more{display:block;margin:6px auto;background:none;border:0;color:var(--faint);font:11px "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.empty{text-align:center;color:var(--faint);padding:30px 10px;font-style:italic}

/* question of the day */
.qd{margin:2px 0 10px;padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(160deg,var(--panel2),var(--panel))}
.qd .k{font:10.5px "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--her)}.qd h3{margin:4px 0 8px;font-weight:500;font-style:italic;font-size:20px}
.qd textarea{width:100%;min-height:64px;resize:vertical;font:inherit;font-size:17px;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:0}.qd textarea:focus{border-color:var(--me)}.qd .both{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qd .both div{padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);white-space:pre-wrap;font-size:16px}.qd .both b{display:block;font:10px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}
.qd.fold .body{display:none}.qd .tg{background:none;border:0;color:var(--faint);float:right;font:11px "JetBrains Mono",monospace}

/* composer dock */
.dock{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 94%,transparent)}
.dock textarea{flex:1;min-height:44px;max-height:132px;resize:none;border-radius:22px;padding:10px 16px;line-height:1.35}
.dock .ib{border-radius:50%;width:44px;height:44px;flex:none}.dock .go{background:var(--me);color:#04101a;border-color:var(--me)}
.dock .ib.on{border-color:var(--sos);color:var(--sos);box-shadow:0 0 12px color-mix(in srgb,var(--sos) 50%,transparent)}
.tray{position:absolute;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10}
.tray button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font:10.5px "JetBrains Mono",monospace;letter-spacing:.06em}.tray button b{font-size:22px;font-weight:400}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(2,3,10,.62);opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:31;left:50%;bottom:0;width:min(560px,100%);max-height:90vh;overflow:auto;transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet.on{transform:translate(-50%,0)}
.sheet h2{margin:0 0 4px;font-size:24px;text-transform:uppercase}.sheet p{color:var(--dim);margin:4px 0 12px}
.sheet label{display:block;margin:10px 0 4px;font:11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.sheet textarea{min-height:140px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);text-align:left}.opt b{font-size:22px;font-weight:400}.opt.s{border-color:var(--sos)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.mt{margin-top:12px}
.setrow .btn{min-height:40px;padding:0 13px}.setrow .row{justify-content:flex-end}.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.setrow:first-of-type{border-top:0}.setrow small{display:block;color:var(--faint);font-size:14px;line-height:1.3}
/* letter reader */
#reader{position:fixed;inset:0;z-index:40;background:radial-gradient(100% 70% at 50% 0%,#1a1f55,var(--bg));overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 22px 40px;display:none}
#reader.on{display:block}.paper{max-width:560px;margin:0 auto}.paper h2{font-family:"Mentifaber Display";font-weight:400;font-size:30px;letter-spacing:.05em;margin:6px 0 16px}.paper .body{white-space:pre-wrap;font-size:21px;line-height:1.7;font-style:italic}.paper .by{margin-top:26px;font:11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--faint)}
/* SOS */
#sos{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:30px;background:radial-gradient(circle,#4a0b17,#12030a);animation:sosb 1.2s infinite alternate}
#sos.on{display:flex}@keyframes sosb{to{background:radial-gradient(circle,#7a0f22,#1a0309)}}#sos h1{margin:0;font-size:clamp(34px,9vw,60px);text-transform:uppercase}#sos p{font-size:20px;color:#ffd0d6;max-width:480px;white-space:pre-wrap}
#sos .btn{background:#fff;color:#4a0b17;border:0;font-size:18px;min-height:64px;padding:0 40px;border-radius:32px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;padding:10px 16px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font:12px "JetBrains Mono",monospace;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div id="gate"><div class="gc" id="gc"><div class="mark" aria-hidden="true"><i></i><i></i></div><h1 class="disp">Barycenter</h1><p>…</p></div></div>

<div id="app" class="hidden">
  <div class="top">
    <div class="nm disp" id="pn">Barycenter<small id="pst"></small></div>
    <button class="ib" id="b-set" aria-label="Settings">⚙</button>
  </div>
  <div id="skyw"><canvas id="sky" aria-hidden="true"></canvas><div id="skycap" aria-live="polite"></div></div>
  <div id="log" aria-live="polite"></div>
  <div class="tray hidden" id="tray"></div>
  <div class="dock">
    <button class="ib" id="b-plus" aria-label="More kinds of message">＋</button>
    <textarea id="txt" rows="1" placeholder="Say something…" aria-label="Message"></textarea>
    <button class="ib" id="b-loud" title="Loud: alerts her more firmly until she has seen it" aria-pressed="false" aria-label="Loud">🔔</button>
    <button class="ib go" id="b-send" aria-label="Send">➤</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="reader"><div class="paper" id="paper"></div></div>
<div id="sos"><div style="font-size:64px">🚨</div><h1 class="disp" id="sos-h"></h1><p id="sos-p"></p><button class="btn" id="sos-ok">I'm here</button></div>
<div id="toast" role="status"></div>

<script src="assets/seal.js"></script>
<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id), enc = new TextEncoder(), dec = new TextDecoder();
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
const b64 = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64u = (u8) => b64(u8).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = (s) => unb64(s.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (s.length % 4)) % 4));
const hex = (u8) => [...u8].map((b) => b.toString(16).padStart(2, "0")).join("");
const unhex = (h) => Uint8Array.from(h.match(/../g), (x) => parseInt(x, 16));
const sha256hex = async (u8) => hex(new Uint8Array(await crypto.subtle.digest("SHA-256", u8)));
const slug = (n) => String(n || "").toLowerCase().replace(/[^a-z0-9]+/g, "").slice(0, 16);
const ITER = 600000;

// ─── keys: one space key, wrapped under each person's password ──────────────────────────────
async function pbk(secret, salt) { const base = await crypto.subtle.importKey("raw", enc.encode(secret), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]); }
async function wrapKey(raw, secret) { const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), k = await pbk(secret, salt), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, raw)), out = new Uint8Array(28 + ct.length); out.set(salt); out.set(iv, 16); out.set(ct, 28); return b64(out); }
async function unwrapKey(w, secret) { const u = unb64(w), k = await pbk(secret, u.subarray(0, 16)); return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.subarray(16, 28) }, k, u.subarray(28))); }
const importKey = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
const loginProof = (user, pass) => MFSeal.proof("us", user + "\0" + pass);
const verifierOf = async (user, pass) => sha256hex(unhex(await loginProof(user, pass)));
let KEY = null;
async function seal(obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); return { ct: b64(new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, enc.encode(JSON.stringify(obj))))), iv: b64(iv) }; }
async function open(m) { try { return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(m.iv) }, KEY, unb64(m.ct)))); } catch (e) { return { k: "lost" }; } }
async function sealBytes(u8) { const iv = crypto.getRandomValues(new Uint8Array(12)), ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, KEY, u8)), out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out; }
async function openBytes(buf) { const u = new Uint8Array(buf); return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u.subarray(0, 12) }, KEY, u.subarray(12))); }

// ─── talking to the server ──────────────────────────────────────────────────────────────────
async function api(path, o) {
  let r; try { r = await fetch("/api/us/" + path, { credentials: "same-origin", cache: "no-store", ...(o || {}) }); } catch (e) { throw { offline: true }; }
  if (r.status === 401) throw { auth: true };
  const j = await r.json().catch(() => ({})); if (!r.ok) throw { err: j.error || "something went wrong (" + r.status + ")", status: r.status };
  return j;
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
async function signIn(user, pass) {
  const proof = await loginProof(user, pass);
  const r = await fetch("/api/login", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ app: "us", proof }) });
  if (r.status === 429) throw { err: "Too many tries. Wait a few minutes." }; if (r.status === 401) throw { err: "That isn't right." }; if (!r.ok) throw { err: "Couldn't reach the server." };
  store.set("us-user", user);
  const me = await api("me"), raw = await unwrapKey(me.wrap, user + "\0" + pass);
  store.set("us-key", b64(raw)); KEY = await importKey(raw); return me; // the key stays on this device so tomorrow it opens straight away
}

// ─── the gate: set up, accept an invite, sign in ────────────────────────────────────────────
const gc = $("gc");
const gate = (html) => { gc.innerHTML = '<div class="mark" aria-hidden="true"><i></i><i></i></div><h1 class="disp">Barycenter</h1>' + html; };

    sync() { capsules = [...M.values()].filter((m) => m.from === ME.user && m.unlock && Date.now() < m.unlock).length; flight = [...M.values()].some((m) => m.from === ME.user && !m.dl && !m.tmp && !(m.unlock && Date.now() < m.unlock)) || [...M.values()].some((m) => m.tmp && !m.unlock); go(); },

    arrive(m) { const c = m.p && m.p.k === "pulse" ? (PULSES.find((x) => x.k === m.p.e) || {}).c : col("--her"); motes.push({ from: "her", t0: performance.now() - t0, dur: 1100, color: c || col("--her") }); rings.push({ at: "me", t0: performance.now() - t0 + 1000, dur: 900, color: c || col("--her") }); go(); },
    delivered(m) { rings.push({ at: "her", t0: performance.now() - t0, dur: 900, color: col("--me") }); go(); },
  };
})();

async function startApp() {
  try { ME = await api("me"); } catch (e) { return showLogin(); }
  if (!KEY) { const raw = store.get("us-key"); if (!raw) return showLogin(ME.name); KEY = await importKey(unb64(raw)); }
  THEM = ME.partner; FIRST = ME.first; seenAt = THEM.seen;
  document.documentElement.style.setProperty("--me", FIRST ? "#7fd8ff" : "#ffc66b"); document.documentElement.style.setProperty("--her", FIRST ? "#ffc66b" : "#7fd8ff"); applyTheme();
  $("gate").classList.add("hidden"); $("app").classList.remove("hidden"); $("pn").firstChild.nodeValue = "Barycenter";
  try { OUT = JSON.parse(store.get("us-out") || "[]"); } catch (e) { OUT = []; }
  M = new Map(); for (const e of OUT) M.set(e.tmp, { id: e.tmp, from: ME.user, ts: e.ts, lvl: e.lvl, unlock: e.unlock, blob: e.blob, p: await open(e), tmp: true, dl: 0, rd: 0, ak: 0 });
  try { await loadHistory(); } catch (e) { if (e.auth) return showLogin(); toast("Offline. Showing what I can."); }

}
async function boot() {
  const h = location.hash.match(/^#join=([a-f0-9]{32})\.([A-Za-z0-9_-]{43})$/);
  let st; try { st = await api("status"); } catch (e) { gate("<p>Can't reach the server. Check your connection and reload.</p>"); return; }
  if (h) { return showClaim(h[1], h[2]); }
  if (!st.configured) return st.owner ? showSetup() : gate('<p>This space hasn\'t been created yet.</p><p>Sign in as the owner through <a href="/vigil-app">Vigil</a>, then come back here to set it up.</p>');
  startApp();
}
boot();
})();
