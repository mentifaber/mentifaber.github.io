<title>Quiet Check-in · Mentifaber</title>
<meta name="description" content="For someone who lives alone: one tap a day to say they&#x27;re OK, and if it doesn&#x27;t come by their time, the family&#x27;s phones are told.">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" href="assets/icons/v2/checkin.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icons/v2/checkin-180.png">
<style>
/* Quiet Check-in: made for older eyes and shaky hands. Warm paper, very large type, one enormous button, high contrast;
   a light page on purpose (it's used in the morning, in daylight), with a dark one for those who set it. */
:root { --bg: #f4efe6; --card: #fffaf2; --ink: #1d1a16; --dim: #5e564b; --line: #d9cfbf; --ok: #1f7a3a; --ok-bg: #dff2e3; --late: #a3321e; --late-bg: #fbe3dc; --btn: #1f7a3a; --btn-ink: #ffffff;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #14120f; --card: #1d1a16; --ink: #f2ebe0; --dim: #b4a996; --line: #3a342b; --ok: #8fd18f; --ok-bg: #18301d; --late: #ff9a80; --late-bg: #3a1f18; --btn: #2f9a4f; --btn-ink: #0b1a0f; color-scheme: dark; } }
* { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 19px/1.5 var(--sans); }
.wrap { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 48px max(18px, env(safe-area-inset-left)); display: grid; gap: 16px; }
h1 { font: 700 34px/1.15 var(--sans); margin: 8px 0 0; } .dim { color: var(--dim); margin: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.big { font: 800 clamp(34px, 11vw, 52px)/1.1 var(--sans); width: 100%; min-height: 42vh; border: 0; border-radius: 28px; background: var(--btn); color: var(--btn-ink); cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,.18); }
.big:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,.18); }
.big.done { background: var(--ok-bg); color: var(--ok); box-shadow: none; font-size: clamp(28px, 8vw, 40px); }
.state { font: 700 24px/1.3 var(--sans); padding: 16px; border-radius: 14px; } .state.ok { background: var(--ok-bg); color: var(--ok); } .state.late { background: var(--late-bg); color: var(--late); } .state.wait { background: var(--card); border: 1px solid var(--line); }
label { display: grid; gap: 6px; font-weight: 600; } input, select { font: 400 19px var(--sans); padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.btn { font: 700 18px var(--sans); padding: 14px 18px; border-radius: 12px; border: 2px solid var(--btn); background: var(--btn); color: var(--btn-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--btn); }
.link { font: 500 14px ui-monospace, Menlo, monospace; word-break: break-all; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; color: var(--dim); }
pre.link { white-space: pre-wrap; font-size: 12.5px; max-height: 320px; overflow: auto; margin: 0; }
.kit { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.kit label, .kit select, .kit input { min-width: 0; max-width: 100%; width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; } .small { font-size: 15px; color: var(--dim); }
:focus-visible { outline: 3px solid var(--ok); outline-offset: 3px; }
.state.away { background: var(--card); border: 1px dashed var(--line); color: var(--dim); }
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; } .days i { aspect-ratio: 1; border-radius: 6px; background: var(--line); display: block; }
.days i.ok { background: var(--ok); } .days i.miss { background: var(--late); opacity: .8; } .days i.none { background: transparent; border: 1px dashed var(--line); } .days i.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.key { display: flex; gap: 14px; flex-wrap: wrap; } .key span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); }
details > summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
</style>

</head>
<body>
<main class="wrap" id="main"></main>
<script>
(() => {
  "use strict";
  const $ = (s) => document.querySelector(s), esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const main = $("#main"), api = async (path, body) => { const r = await fetch("/api/checkin" + path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {}); let j = {}; try { j = await r.json(); } catch (e) {} if (!r.ok) throw new Error(j.error || "The site didn't answer. Try again in a moment."); return j; };

  const day = (d) => new Date(d + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  // a motion sensor's rooms: when each last saw someone (only the room and the time are kept)
  const rooms = (s) => { const q = s.sensor; if (!q || !q.rooms.length) return "";
    return '<div class="card" id="rooms"><b>Movement</b>' + (q.quietNow ? '<div class="state late" id="quietNote">No movement for ' + Math.floor((Date.now() - q.lastMove) / 3600e3) + " hours" + (q.quietTold ? ": the family has been told" : "") + ".</div>" : "") +
      '<ul class="small" style="margin:6px 0 0;padding-left:18px">' + q.rooms.map((r) => "<li>" + esc(r.room.charAt(0).toUpperCase() + r.room.slice(1)) + ": " + esc(at(r.at)) + (new Date(r.at).toDateString() === new Date().toDateString() ? "" : ", " + esc(new Date(r.at).toLocaleDateString([], { month: "short", day: "numeric" }))) + "</li>").join("") + "</ul>" +
      (q.quiet ? '<p class="small">The family is told if no room sees anyone for ' + q.quiet + " hours between 7 a.m. and 10 p.m.</p>" : "") + "</div>"; };
  const back = (d, n) => new Date(Date.parse(d + "T12:00:00Z") - n * 864e5).toISOString().slice(0, 10);
  const copy = (b, t) => navigator.clipboard && navigator.clipboard.writeText(t).then(() => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500); }, () => {});

  function setup() {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    main.innerHTML = '<h1>Quiet Check-in</h1><p class="dim">For someone who lives alone. Once a day they tap one big button to say they\'re OK. If it hasn\'t come by their time, the family\'s phones are told. No camera, no microphone, no tracking: just the tap.</p>' +
      '<form class="card" id="f"><label>Their first name<input id="name" maxlength="40" required placeholder="Gran"></label><label>Check in by<input id="by" type="time" value="10:00" required></label>' +
      '<label>Their time zone<input id="tz" value="' + esc(tz) + '"></label><button class="btn" type="submit">Set it up</button><p class="small" id="st" role="status"></p></form>';
    $("#f").onsubmit = async (e) => { e.preventDefault(); try { const r = await api("", { name: $("#name").value, by: $("#by").value, tz: $("#tz").value.trim() });
      const me = location.origin + "/checkin#me." + r.id + "." + r.me, fam = location.origin + "/checkin#fam." + r.id + "." + r.fam;
      main.innerHTML = '<h1>Two links</h1><div class="card"><b>For ' + esc($("#name").value) + '</b><p class="small">Open it on their phone and add it to the home screen (Share, then "Add to Home Screen"). It\'s their button.</p><div class="link">' + esc(me) + '</div><div class="row"><button class="btn ghost" id="c1" type="button">Copy</button></div></div>' +
        '<div class="card"><b>For the family</b><p class="small">Send it to everyone who should be told. Each opens it once and turns on alerts on their phone.</p><div class="link">' + esc(fam) + '</div><div class="row"><button class="btn ghost" id="c2" type="button">Copy</button></div></div><p class="small">Keep both private: anyone with a link can use it.</p>';
      $("#c1").onclick = () => copy($("#c1"), me); $("#c2").onclick = () => copy($("#c2"), fam);
    } catch (x) { $("#st").textContent = x.message; } };
  }

  async function me(id, t) {
    let s; try { s = await api("/" + id + "?t=" + t); } catch (e) { main.innerHTML = "<h1>Quiet Check-in</h1><p class=\"dim\">" + esc(e.message) + "</p>"; return; }
    const draw = () => { main.innerHTML = '<h1>Good ' + (new Date().getHours() < 12 ? "morning" : new Date().getHours() < 18 ? "afternoon" : "evening") + ", " + esc(s.name) + "</h1>" +
      (s.today ? '<button class="big done" type="button" id="ok">✓ Done for today<br><span style="font-size:22px;font-weight:600">' + esc(at(s.last)) + "</span></button><p class=\"dim\">Your family won't be bothered today. See you tomorrow.</p>"
        : '<button class="big" type="button" id="ok">I\'m OK</button><p class="dim">Tap it before ' + esc(s.by) + ". If it isn't tapped by then, your family is told.</p>") +
      (s.away ? '<div class="state away" id="awayNote">Away until ' + esc(day(s.away)) + ". Your family won't be told about missed check-ins till then.</div>" : "") +
      rooms(s) +
      '<details class="small" id="set"' + (open ? " open" : "") + '><summary>Settings</summary><div class="card" style="margin-top:10px"><label>Check in by<input id="by" type="time" value="' + esc(s.by) + '"></label><div class="row"><button class="btn ghost" id="save" type="button">Save</button></div></div>' +
      '<div class="card" style="margin-top:10px"><b>Going away?</b><p class="small">Pick the last day you\'re away and nobody is told about missed check-ins until then.</p><label>Away until<input id="away" type="date" min="' + esc(s.date) + '" value="' + esc(s.away || "") + '"></label><div class="row"><button class="btn ghost" id="saveAway" type="button">Save</button>' + (s.away ? '<button class="btn ghost" id="back" type="button">I\'m back</button>' : "") + "</div></div>" +
      '<div class="card" style="margin-top:10px"><b>Let a device check in for you</b><p class="small">A link that only checks in: a smart-home automation (say, the first time the kettle or a door is used each morning), a phone shortcut or a sensor can open it, and that counts as today\'s check-in. It can\'t see or change anything else.</p>' +
      (devKey ? '<div class="link" id="devLink">' + esc(devUrl()) + '</div><p class="small">Shown once. Copy it into the automation now; making a new one stops this one.</p><div class="row"><button class="btn ghost" id="cDev" type="button">Copy</button></div>' : "") +
      '<div class="row"><button class="btn ghost" id="mkDev" type="button">' + (s.device ? "Make a new device link" : "Make a device link") + "</button>" + (s.device ? '<button class="btn ghost" id="offDev" type="button">Turn it off</button>' : "") + '</div><p class="small" id="devSt">' + (s.device ? "A device link is on." : "") + "</p></div>" +
      '<div class="card" style="margin-top:10px"><b>A motion sensor</b><p class="small">A Wi-Fi motion sensor (like Bodywake), or any sensor an automation can make call a link, reports movement by room with the device link: the first movement of the day checks you in, and the family can see when a room last saw someone. Only the room and the time are kept: no camera, no microphone, nothing the sensor measured.</p>' +
      (devKey ? '<p class="small">The sensor\'s link (change <code>room=kitchen</code> for each room it covers):</p><div class="link" id="senseLink">' + esc(senseUrl()) + '</div><div class="row"><button class="btn ghost" id="cSense" type="button">Copy the sensor link</button></div>' +
        '<div class="kit" id="kit"><b>A sensor, ready to plug in</b><p class="small">A setup file with your sensor link already in it: put it on the sensor once, plug the sensor in in that room, and it checks you in. Nothing else to set up here.</p>' +

        '<pre class="link" id="kOut" tabindex="0" aria-label="The setup file"></pre><div class="row"><button class="btn ghost" id="kCopy" type="button">Copy</button><button class="btn ghost" id="kSave" type="button">Download it</button></div>' +
        '<p class="small" id="kHow"></p><p class="small">The file holds your sensor link: keep it like a key. Making a new device link above stops the old one, and then the sensor needs a new file.</p></div>' : '<p class="small">Make a device link above; the sensor uses the same key.</p>') +
      '<label>Tell the family if it\'s quiet for<select id="quiet">' + [[0, "never (off)"], [2, "2 hours"], [3, "3 hours"], [4, "4 hours"], [6, "6 hours"], [8, "8 hours"], [12, "12 hours"]].map(([v, l]) => '<option value="' + v + '"' + (((s.sensor && s.sensor.quiet) || 0) === v ? " selected" : "") + ">" + l + "</option>").join("") + '</select></label><p class="small">Only between 7 a.m. and 10 p.m., at most once a day, and not while you\'re away.</p>' +

      const set = (body, keep) => async () => { try { s = await api("/" + id + "/settings", { t, ...body() }); open = true; if (!keep) devKey = ""; draw(); } catch (e) { alert(e.message); } };
      $("#ok").onclick = async () => { try { s = await api("/" + id + "/ok", { t }); draw(); } catch (e) { alert(e.message); } };
      $("#save").onclick = set(() => ({ by: $("#by").value })); $("#saveAway").onclick = set(() => ({ away: $("#away").value || null })); if ($("#back")) $("#back").onclick = set(() => ({ away: null }));

      if ($("#offDev")) $("#offDev").onclick = async () => { try { s = await api("/" + id + "/device", { t, off: true }); devKey = ""; open = true; draw(); } catch (e) { alert(e.message); } };
      if ($("#cDev")) $("#cDev").onclick = () => copy($("#cDev"), devUrl());
      $("#saveQuiet").onclick = set(() => ({ quiet: Number($("#quiet").value) }), true);
      if ($("#forget")) $("#forget").onclick = set(() => ({ rooms: null }), true);
      if ($("#cSense")) $("#cSense").onclick = () => copy($("#cSense"), senseUrl());
      if ($("#kit")) { const kit = () => { const k = $("#kKind").value, f = sensorKit(k, $("#kRoom").value, $("#kEnt").value, location.origin + "/api/checkin/" + id + "/sense?t=" + devKey); $("#kEntL").hidden = k !== "ha"; $("#kOut").textContent = f.text; $("#kHow").textContent = f.how; return f; };
        for (const x of ["#kRoom", "#kKind", "#kEnt"]) $(x).addEventListener("input", kit); kit();
        $("#kCopy").onclick = () => copy($("#kCopy"), kit().text);
        $("#kSave").onclick = () => { const f = kit(), a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([f.text], { type: "text/yaml" })); a.download = f.file; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }; } };
    // the sensor kit (game plan GP-6.2): a setup file that already holds this person's sensor link, for an ESP32 with a PIR
    // or an LD2410 radar (ESPHome), or for a motion sensor already in Home Assistant. Movement calls the link with the room;
    // every 6 hours it sends a heartbeat (motion=0) so the family can see the sensor is alive.
    const sensorKit = (kind, room0, ent0, base) => {
      const room = String(room0 || "").toLowerCase().replace(/[^a-z0-9 -]/g, "").trim().slice(0, 24) || "kitchen", slug = room.replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "room";
      const ent = /^binary_sensor\.[a-z0-9_]{1,60}$/.test(String(ent0 || "").trim()) ? String(ent0).trim() : "binary_sensor." + slug.replace(/-/g, "_") + "_motion";
      const url = (m) => base + "&room=" + encodeURIComponent(room) + "&motion=" + m, q = (x) => '"' + x.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
      if (kind === "ha") return { file: "quiet-checkin-" + slug + ".yaml", how: "Add this to Home Assistant's configuration.yaml (or a package), then restart Home Assistant. Change the sensor's name if yours is called something else.", text: [
        "# Quiet Check-in: movement in the " + room + " checks you in (mentifaber.org/checkin)", "rest_command:", "  quiet_checkin_" + slug.replace(/-/g, "_") + ":", "    url: " + q(url(1)), "    method: GET", "  quiet_checkin_" + slug.replace(/-/g, "_") + "_alive:", "    url: " + q(url(0)), "    method: GET", "",
        "automation:", "  - alias: " + q("Quiet Check-in: " + room + " movement"), "    mode: single", "    triggers:", "      - trigger: state", "        entity_id: " + ent, "        to: \"on\"", "    actions:", "      - action: rest_command.quiet_checkin_" + slug.replace(/-/g, "_"), "      - delay: \"00:01:00\"",
        "  - alias: " + q("Quiet Check-in: " + room + " sensor alive"), "    triggers:", "      - trigger: time_pattern", "        hours: \"/6\"", "    actions:", "      - action: rest_command.quiet_checkin_" + slug.replace(/-/g, "_") + "_alive", ""].join("\n") };
      const radar = kind === "ld2410", head = [
        "# Quiet Check-in sensor for the " + room + " (mentifaber.org/checkin). Flash it with ESPHome; Wi-Fi comes from your secrets.yaml.", "esphome:", "  name: quiet-checkin-" + slug, "  friendly_name: " + q("Quiet Check-in " + room), "",
        "esp32:", "  board: esp32dev", "  framework:", "    type: esp-idf", "", "logger:", "ota:", "  - platform: esphome", "",
        "wifi:", "  ssid: !secret wifi_ssid", "  password: !secret wifi_password", "  ap:", "    ssid: \"Quiet Check-in setup\"", "captive_portal:", "",
        "http_request:", "  verify_ssl: true", ""];

      const body = radar ? ["uart:", "  tx_pin: GPIO17", "  rx_pin: GPIO16", "  baud_rate: 256000", "  parity: NONE", "  stop_bits: 1", "", "ld2410:", "", "binary_sensor:", "  - platform: ld2410", "    has_target:", "      name: Presence", "      on_press:", ...call(1, "        "), ""]
        : ["binary_sensor:", "  - platform: gpio", "    pin: GPIO13", "    name: Motion", "    device_class: motion", "    filters:", "      - delayed_off: 30s", "    on_press:", ...call(1, "      "), ""];
      const alive = ["interval:", "  - interval: 6h", "    then:", ...call(0, "      "), ""];
      return { file: "quiet-checkin-" + slug + ".yaml", how: radar ? "Wire the LD2410 to the ESP32 (its TX to GPIO16, RX to GPIO17, 5V and ground), add this file in ESPHome, and install it. Then plug it in facing the room." : "Wire the PIR sensor's output to GPIO13 on the ESP32 (and 3.3V and ground), add this file in ESPHome, and install it. Then plug it in where it can see the room.", text: [...head, ...body, ...alive].join("\n") };
    };
    let open = false, devKey = ""; const devUrl = () => location.origin + "/api/checkin/" + id + "/ok?t=" + devKey, senseUrl = () => location.origin + "/api/checkin/" + id + "/sense?t=" + devKey + "&room=kitchen";
    draw();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/checkin-sw.js", { scope: "/checkin" }).catch(() => {}); // so the button opens on a weak signal
  }

  async function family(id, t) {
    let s; try { s = await api("/" + id + "?t=" + t); } catch (e) { main.innerHTML = "<h1>Quiet Check-in</h1><p class=\"dim\">" + esc(e.message) + "</p>"; return; }
    const line = s.today ? '<div class="state ok">✓ ' + esc(s.name) + " checked in today at " + esc(at(s.last)) + (s.via === "device" ? " (by their device)" : /sensor$/.test(s.via || "") ? " (the " + esc(s.via) + ")" : "") + "</div>" : s.away ? '<div class="state away">' + esc(s.name) + " is away until " + esc(day(s.away)) + ". You won't be told about missed check-ins till then.</div>" : s.late ? '<div class="state late">' + esc(s.name) + " hasn't checked in today. Their time was " + esc(s.by) + ". Give them a call.</div>" : '<div class="state wait">' + esc(s.name) + " hasn't checked in yet today. Their time is " + esc(s.by) + ".</div>";
    const can = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
    const days = new Set(s.days || []), strip = Array.from({ length: 14 }, (_, i) => back(s.date, 13 - i)).map((d) => {
      const c = days.has(d) ? "ok" : d < s.since ? "none" : d === s.date ? "" : "miss";
      return '<i class="' + c + (d === s.date ? " now" : "") + '" title="' + esc(day(d)) + ": " + (c === "ok" ? "checked in" : c === "none" ? "before this was set up" : c === "miss" ? "no check-in" : "today") + '"></i>'; }).join("");
    const hist = '<div class="card"><b>The last two weeks</b><div class="days" id="days" role="img" aria-label="' + esc([...days].filter((d) => d > back(s.date, 14)).length + " check-ins in the last 14 days") + '">' + strip + '</div><div class="key small"><span style="--c:var(--ok)">checked in</span><span style="--c:var(--late)">no check-in</span></div></div>';
    main.innerHTML = "<h1>" + esc(s.name) + "</h1>" + line + rooms(s) + hist + '<div class="card"><b>Alerts on this phone</b><p class="small">' + (s.watchers ? s.watchers + " phone" + (s.watchers > 1 ? "s" : "") + " will be told if a check-in is missed." : "No phone is set to be told yet.") + "</p>" +
      (can ? '<div class="row"><button class="btn" id="watch" type="button">Tell this phone</button><span class="small" id="wst" role="status"></span></div>' : '<p class="small">This browser can\'t take alerts. On an iPhone, add this page to the home screen first, then open it from there.</p>') + "</div>" +
      '<p class="small">Their time zone: ' + esc(s.tz) + ". Last check-in: " + (s.last ? esc(new Date(s.last).toLocaleString()) : "never") + ".</p>";
    if ($("#watch")) $("#watch").onclick = async () => {
      const st = $("#wst"); st.textContent = "Asking…";
      try {
        if ((await Notification.requestPermission()) !== "granted") throw new Error("Alerts are turned off for this site in the phone's settings.");
        const reg = await navigator.serviceWorker.register("/checkin-sw.js", { scope: "/checkin" }); await navigator.serviceWorker.ready;
        const key = (await (await fetch("/api/push/key")).json()).key, raw = Uint8Array.from(atob(key.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - (key.length % 4)) % 4)), (c) => c.charCodeAt(0));
        const sub = (await reg.pushManager.getSubscription()) || (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: raw }));
        await api("/" + id + "/watch", { t, sub: sub.toJSON() });
        const cache = await caches.open("checkin-v1"), old = await cache.match("/checkin/circles"), list = old ? await old.json() : [];
        if (!list.some((c) => c.id === id)) list.push({ id, t }); await cache.put("/checkin/circles", new Response(JSON.stringify(list), { headers: { "content-type": "application/json" } }));
        family(id, t);
      } catch (x) { st.textContent = x.message; }
    };
  }
  function route() { const h = location.hash.slice(1), m = /^(me|fam)\.([0-9a-f]{16})\.([0-9a-f]{32})$/.exec(h); if (!m) return setup(); return m[1] === "me" ? me(m[2], m[3]) : family(m[2], m[3]); }
  addEventListener("hashchange", route); route();
})();
</script>
