<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0c">
<title>AutoFaber build</title>
<link rel="icon" href="/assets/hive/genesis-mark-64.webp">
<style>
:root { --bg: #0b0b0c; --ink: #e9e4d8; --dim: #8d877a; --gold: #c9a24a; --gold-hi: #e6c46e; --line: #26231e; --bad: #ff7b72; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; flex-direction: column; }
#bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); min-height: 40px; }
#bar img { width: 22px; height: 22px; flex: none; }
#bar .t { min-width: 0; flex: 1; }
#bar b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar small { color: var(--dim); }
#bar a, #bar button { color: var(--gold); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; text-decoration: none; white-space: nowrap; }
#bar a:hover, #bar button:hover { border-color: var(--gold); color: var(--gold-hi); }
#bar .err { color: var(--bad); border-color: #4a2723; }
#priv { display: none; align-items: center; gap: 10px; padding: 7px 12px; background: #1a1610; border-bottom: 1px solid #3a3020; color: var(--gold-hi); }
#priv span { flex: 1; }
#priv button { background: var(--gold); color: #141109; border: 0; border-radius: 6px; padding: 6px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
iframe { flex: 1; width: 100%; border: 0; background: #fff; }
#msg { margin: auto; padding: 24px 16px; max-width: 520px; text-align: center; color: var(--dim); }
#msg h1 { color: var(--ink); font-size: 18px; margin: 0 0 8px; }
body.bare #bar, body.bare #priv { display: none !important; }
#show { display: none; position: fixed; right: 10px; bottom: 10px; z-index: 2; opacity: .55; background: var(--bg); color: var(--gold); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; }
body.bare #show { display: block; }
@media (max-width: 560px) { #bar small { display: none; } #hide { display: none; } }
</style>
</head>
<body>
<div id="bar"><img src="/assets/hive/genesis-mark-64.webp" alt=""><div class="t"><b id="title">Loading…</b><small id="sub">An AutoFaber build · mentifaber.org</small></div>
  <button id="errs" class="err" hidden></button><a id="edit" hidden>Open in AutoFaber</a><button id="hide" title="Hide this bar">Full screen</button></div>
<div id="priv"><span>Private preview: only you can open this link. AutoFaber built it; you decide if it goes public.</span><button id="pub">Make public</button></div>
<div id="msg" hidden></div>
<button id="show" title="Show the bar">◈</button>
<script src="/assets/hive/runner.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id), slug = (location.pathname.match(/^\/p\/([\w-]+)/) || [])[1] || new URLSearchParams(location.search).get("s");
  const say = (h, t) => { $("msg").hidden = false; $("msg").innerHTML = "<h1></h1><p></p>"; $("msg").querySelector("h1").textContent = h; $("msg").querySelector("p").textContent = t; };
  $("hide").onclick = () => document.body.classList.add("bare"); $("show").onclick = () => document.body.classList.remove("bare");
  if (!slug) { $("title").textContent = "AutoFaber"; return say("No build here", "This address doesn't name a build."); }
  let j; try { const r = await fetch("/api/hive/pub/" + encodeURIComponent(slug), { credentials: "same-origin", cache: "no-store" }); j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); }
  catch (e) { $("title").textContent = "AutoFaber"; return say("Nothing here", "This build isn't published, or it was taken down."); }
  document.title = j.title + " · AutoFaber"; $("title").textContent = j.title;
  $("sub").textContent = (j.by === "genesis" ? "Built by AutoFaber, on its own" : "Built with AutoFaber's Swarm") + " · " + new Date(j.ts).toLocaleDateString() + (j.v > 1 ? " · version " + j.v : "");
  if (j.id) { $("edit").hidden = false; $("edit").href = "/hive-app?p=" + encodeURIComponent(j.id); } // the owner: straight to the mission
  if (j.id && !j.live) { $("priv").style.display = "flex"; $("pub").onclick = async () => {
    $("pub").disabled = true; const r = await fetch("/api/hive/publish", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: j.id }) }).then((x) => x.json()).catch(() => ({ error: "offline" }));
    if (r.error) { $("pub").disabled = false; $("pub").textContent = "Try again"; return; } $("priv").querySelector("span").textContent = "Public now: anyone with this link can open it."; $("pub").remove(); }; }
  const R = window.HiveRun, fs = R.files(j.final), f = R.entry(fs);
  if (!f) return say("Nothing to run", "This result is code or writing without a page to run. Open it in AutoFaber to read it.");
  const frame = document.createElement("iframe"); frame.title = j.title;
  frame.setAttribute("sandbox", "allow-scripts allow-modals allow-forms allow-pointer-lock allow-popups allow-downloads"); // no allow-same-origin: it can't touch this site or its sign-in
  frame.setAttribute("allow", "fullscreen; clipboard-write; autoplay"); document.body.insertBefore(frame, $("show"));
  const errs = []; R.run(frame, f, fs, (kind, text) => { if (kind === "exception" || kind === "error") { errs.push(text); if (j.id) { $("errs").hidden = false; $("errs").textContent = errs.length + " error" + (errs.length > 1 ? "s" : ""); $("errs").title = errs.slice(-5).join("\n"); $("errs").onclick = () => (location.href = $("edit").href); } } });
})();
</script>
</body>
</html>
