<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Nest Registry</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="A private baby gift registry.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500;1,9..144,650&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a nursery-mobile header band (countdown + coverage ring) over a filterable card wall; parents get a back-office "room". */
:root {
  /* The Faber nest: white, powder blue, blush pink and gold */
  --bg: #fbfcfe;
  --surface: #ffffff;
  --surface-2: #eef4fb;
  --ink: #1d2d55;          /* deep blue */
  --ink-soft: #5a6a8e;
  --line: #dce5f2;
  --accent: #3a6fc4;       /* blue: actions */
  --accent-ink: #ffffff;
  --accent-soft: #e4eefb;
  --pink: #d9779c;         /* blush */
  --pink-ink: #b0466f;
  --pink-soft: #fce8f0;
  --gold: #c9a24a;         /* gold: what's covered, what matters most */
  --gold-ink: #8a6716;
  --gold-soft: #f8efd8;
  --plum: #b0466f;         /* dream gifts: pink */
  --plum-soft: #fce8f0;
  --sage: #8a6716;         /* covered: gold */
  --sage-soft: #f8efd8;
  --rose: #c2416f;         /* must-haves */
  --rose-soft: #fde4ec;
  --band: linear-gradient(118deg, #e6f0fc 0%, #f4f0fb 42%, #fdeef4 72%, #fbf4e3 100%);
  --band-ink: #1d2d55;
  --band-soft: #66769a;
  --ring-track: rgb(29 45 85 / .09);
  --shadow: 0 1px 2px rgb(29 45 85 / .06), 0 8px 24px rgb(29 45 85 / .07);
  --f-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --f-body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --tile-mix: 100%;
  --glyph-lift: 0%;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1630; --surface: #16213f; --surface-2: #1e2b50; --ink: #eef2fb; --ink-soft: #a9b4d2; --line: #2b3a63;
  --accent: #8db3f0; --accent-ink: #0e1630; --accent-soft: #1f3260; --pink: #f1a0bf; --pink-ink: #f1a0bf; --pink-soft: #43233a;
  --gold: #e3c06e; --gold-ink: #e3c06e; --gold-soft: #3a3018; --plum: #f1a0bf; --plum-soft: #43233a; --sage: #e3c06e; --sage-soft: #3a3018; --rose: #f38aa9; --rose-soft: #4a2133;
  --band: linear-gradient(118deg, #13224a 0%, #221f45 50%, #33203a 78%, #2f2717 100%); --band-ink: #f3f5fb; --band-soft: #a9b4d2; --ring-track: rgb(255 255 255 / .12);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --tile-mix: 18%; --glyph-lift: 45%;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1630; --surface: #16213f; --surface-2: #1e2b50; --ink: #eef2fb; --ink-soft: #a9b4d2; --line: #2b3a63;
  --accent: #8db3f0; --accent-ink: #0e1630; --accent-soft: #1f3260; --pink: #f1a0bf; --pink-ink: #f1a0bf; --pink-soft: #43233a;
  --gold: #e3c06e; --gold-ink: #e3c06e; --gold-soft: #3a3018; --plum: #f1a0bf; --plum-soft: #43233a; --sage: #e3c06e; --sage-soft: #3a3018; --rose: #f38aa9; --rose-soft: #4a2133;
  --band: linear-gradient(118deg, #13224a 0%, #221f45 50%, #33203a 78%, #2f2717 100%); --band-ink: #f3f5fb; --band-soft: #a9b4d2; --ring-track: rgb(255 255 255 / .12);
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .25); --tile-mix: 18%; --glyph-lift: 45%;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.2 var(--f-mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- header band ---------- */
.band { background: var(--band); color: var(--band-ink); position: relative; overflow: hidden; }
.band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--pink), var(--gold)); }
.crest { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--gold); color: var(--gold-ink); font: italic 600 16px/1 var(--f-display); letter-spacing: .02em; background: color-mix(in srgb, var(--surface) 55%, transparent); margin-bottom: 12px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--gold) 18%, transparent); }
.babyname { background: linear-gradient(95deg, var(--ink) 10%, var(--accent) 45%, var(--pink-ink) 75%, var(--gold-ink)); -webkit-background-clip: text; background-clip: text; color: transparent; font-style: italic; padding-bottom: .08em; }
.pill.star { background: var(--gold-soft) !important; color: var(--gold-ink) !important; border: 1px solid var(--gold) !important; }
.card.mine { border-color: var(--gold) !important; box-shadow: 0 0 0 1px var(--gold) !important; }
.tab[aria-current="page"] { background: var(--ink); }
.band .wrap { padding-block: 28px 30px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; position: relative; z-index: 1; }
#mobile { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
@media (max-width: 640px) { #mobile { opacity: .28; } }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--band-soft); }
.babyname { font-size: clamp(34px, 6vw, 64px); font-weight: 800; letter-spacing: -.02em; margin-top: 10px; }
.parents-line { color: var(--band-soft); margin-top: 8px; font-size: 16px; }
.welcome { max-width: 60ch; margin-top: 12px; color: var(--band-ink); opacity: .9; }
.dates { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 18px; }
.date-chip { display: grid; gap: 3px; }
.date-chip b { font: 600 15px/1.2 var(--f-body); }
.date-chip span { font: 400 12px/1.2 var(--f-mono); color: var(--band-soft); letter-spacing: .04em; }
.weeks { margin-top: 18px; max-width: 520px; }
.weeks-track { display: grid; grid-template-columns: repeat(40, 1fr); gap: 2px; margin-top: 8px; }
.weeks-track i { height: 10px; border-radius: 2px; background: var(--ring-track); }
.weeks-track i.on { background: linear-gradient(180deg, var(--gold), color-mix(in srgb, var(--gold) 70%, var(--pink))); }
.weeks-track i.now { background: var(--pink); box-shadow: 0 0 0 2px var(--accent); }
.weeks-legend { display: flex; justify-content: space-between; margin-top: 6px; font: 400 11px var(--f-mono); color: var(--band-soft); }
.ring-box { display: grid; justify-items: center; gap: 8px; text-align: center; }
.ring { width: 150px; height: 150px; }
.ring text { font-family: var(--f-display); }
.ring-stats { display: grid; gap: 2px; font-size: 13px; color: var(--band-soft); }
.ring-stats b { color: var(--band-ink); font-weight: 600; }

/* ---------- nav ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; gap: 6px; padding-block: 10px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--ink-soft); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tab .count { font: 500 11px var(--f-mono); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 7px; }
.nav .spacer { flex: 1; }
.who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.who img { width: 26px; height: 26px; border-radius: 50%; }
.role-pill { font: 500 10px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }

/* ---------- buttons & fields ---------- */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .12s, background .12s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); background: var(--accent); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 40%, var(--line)); }
.btn.small { padding: 6px 11px; font-size: 13px; border-radius: 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; }
.field small { color: var(--ink-soft); font-size: 12px; }
.input, select.input, textarea.input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
textarea.input { resize: vertical; min-height: 76px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

/* ---------- toolbar ---------- */
.toolbar { display: grid; gap: 12px; padding-block: 20px 6px; }
.toolbar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.search { flex: 1 1 240px; position: relative; min-width: 0; }
.search input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--ink-soft); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { font-family: var(--f-mono); font-size: 11px; opacity: .65; margin-left: 4px; }
.toolbar select.input { width: auto; padding: 8px 10px; font-size: 13px; }
.result-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--ink-soft); font-size: 13px; padding-block: 8px 4px; }

/* ---------- item cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; padding-block: 10px 60px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; transition: box-shadow .15s, transform .15s; }
.card:hover { box-shadow: var(--shadow); }
.card.covered { opacity: .72; }
.card.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.thumb { aspect-ratio: 4 / 3; background: var(--surface-2); position: relative; display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb .glyph { font: 800 64px/1 var(--f-display); color: color-mix(in srgb, var(--tile-ink), #fff var(--glyph-lift)); opacity: .9; }
.thumb .glyph-sub { position: absolute; bottom: 10px; left: 12px; font: 500 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: color-mix(in srgb, var(--tile-ink), #fff var(--glyph-lift)); opacity: .8; }
.badges { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font: 500 10.5px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.pill.must { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
.pill.love { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.dream { background: var(--plum-soft); color: var(--plum); border-color: transparent; }
.pill.star { background: var(--ink); color: var(--bg); border-color: transparent; }
.pill.ok { background: var(--sage-soft); color: var(--sage); border-color: transparent; }
.pill.you { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.card-body { padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; align-content: start; }
.card h3 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.meta-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-soft); }
.price { font: 500 15px var(--f-mono); color: var(--ink); }
.notes { font-size: 13.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { font-size: 12.5px; font-weight: 600; text-decoration: none; padding: 4px 9px; border-radius: 7px; background: var(--surface-2); color: var(--ink); overflow-wrap: anywhere; }
.links a:hover { background: var(--accent-soft); color: var(--accent); }
.qty { display: grid; gap: 6px; }
.qty-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-soft); }
.qty-row b { color: var(--ink); font-family: var(--f-mono); font-weight: 500; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--sage); }
.bar i.reserved { background: color-mix(in srgb, var(--sage) 45%, var(--surface-2)); }
.card-foot { padding: 0 16px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.card-foot .btn { flex: 1 1 auto; }
.claimers { font-size: 12.5px; color: var(--ink-soft); display: grid; gap: 3px; }
.claimers b { color: var(--ink); font-weight: 600; }

/* ---------- empty / status ---------- */
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 40px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; color: var(--ink-soft); margin-block: 20px 60px; }
.empty h2 { color: var(--ink); font-size: 24px; }
.empty p { max-width: 52ch; margin: 0; }
.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 16px; }
.notice.rose { background: var(--rose-soft); }
.notice.sage { background: var(--sage-soft); }

/* ---------- panels (my gifts / parents) ---------- */
.section { padding-block: 26px 60px; display: grid; gap: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 16px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.panel h2 { font-size: 22px; font-weight: 600; }
.panel p.sub { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; max-width: 64ch; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.rows { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .mini { width: 46px; height: 46px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; font: 800 20px var(--f-display); color: color-mix(in srgb, var(--tile-ink, var(--ink)), #fff var(--glyph-lift)); }
.row .mini img { width: 100%; height: 100%; object-fit: cover; }
.row .avatar { width: 36px; height: 36px; border-radius: 50%; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-sub { font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
.row-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.giver { border-top: 1px solid var(--line); padding-block: 14px; display: grid; gap: 10px; }
.giver:first-child { border-top: 0; padding-top: 0; }
.giver-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.giver-head img { width: 32px; height: 32px; border-radius: 50%; }
.giver-head .name { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.giver ul { list-style: none; margin: 0; padding: 0 0 0 42px; display: grid; gap: 6px; }
.giver li { display: flex; gap: 10px; align-items: baseline; font-size: 14px; flex-wrap: wrap; }
.giver li .note { flex-basis: 100%; font-size: 13px; color: var(--ink-soft); font-style: italic; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; user-select: none; }
.check input { width: 18px; height: 18px; accent-color: var(--sage); }
.toggle-group { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.toggle-group button { border: 0; background: var(--surface); padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.toggle-group button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.statgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
.stat b { font: 600 26px/1 var(--f-display); }
.stat span { font-size: 12.5px; color: var(--ink-soft); }
.feed { display: grid; gap: 10px; font-size: 14px; }
.feed div { display: flex; gap: 10px; align-items: baseline; }
.feed time { font: 400 11.5px var(--f-mono); color: var(--ink-soft); white-space: nowrap; min-width: 70px; }
.addr { white-space: pre-line; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 14px; overflow-wrap: anywhere; }

/* ---------- dialogs ---------- */
dialog { border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--ink); width: min(620px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); box-shadow: 0 24px 80px rgb(0 0 0 / .35); }
dialog::backdrop { background: rgb(13 17 34 / .55); backdrop-filter: blur(3px); }
dialog.wide { width: min(940px, calc(100vw - 24px)); }
.dlg { display: flex; flex-direction: column; max-height: calc(100dvh - 24px); }
.dlg-head { padding: 20px 22px 12px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
.dlg-head h2 { font-size: 22px; font-weight: 600; }
.dlg-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.dlg-body { padding: 18px 22px; overflow-y: auto; display: grid; gap: 16px; }
.dlg-foot { padding: 14px 22px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.dlg-foot .left { margin-right: auto; }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { border: 0; background: var(--surface-2); width: 40px; height: 40px; font-size: 18px; cursor: pointer; }
.stepper output { min-width: 48px; text-align: center; font: 500 16px var(--f-mono); }
.choice { display: grid; gap: 8px; }
.choice label { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice input { margin-top: 3px; accent-color: var(--accent); }
.choice b { display: block; }
.choice small { color: var(--ink-soft); }

    else if (k === "style") el.style.cssText = v;

  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";

async function claimItem(item, entry, from, prevMine) {
  if (!S.db || !S.myId) { toast("Open the invite link the parents sent you to mark gifts."); return false; }
  const isFund = item.kind === "fund";
  const growing = !isFund && entry.qty > (prevMine?.qty || 0);
  try {
    if (growing) {
      // Short lease so two people can't take the last one at the same moment.
      const lock = S.db.doc("locks/" + item.id);
      let got = await lock.acquire({ holder: S.myId, ttlMs: 6000 });
      if (!got.acquired) { await new Promise(r => setTimeout(r, 1500)); got = await lock.acquire({ holder: S.myId, ttlMs: 6000 }); }
      if (!got.acquired) { toast("Someone else is grabbing this right now. Try again in a moment."); return false; }
      const fresh = await S.db.collection("claims").get();
      let others = 0;
      for (const d of fresh.docs) if (d.id !== S.myId) others += d.data()?.items?.[item.id]?.qty || 0;
      const avail = Math.max(0, (Number(item.qty) || 1) - others);
      if (avail <= 0) { toast("Someone just covered the last one. Thanks anyway!"); return false; }
      if (entry.qty > avail) { entry.qty = avail; toast(`Only ${avail} left, so you've got ${avail}.`); }
    }
    await writeMine(doc => { doc.items[item.id] = entry; if (from) doc.from = from; });
    if (from) try { localStorage.setItem("nest.from", from); } catch {}
    return true;
  } catch (e) { writeError(e); return false; }
}

    const cur = S.claims.get(S.myId);

}

      const box = h("input", { type: "checkbox", value: String(i), disabled: exists, onchange: (e) => { e.target.checked ? picked.add(i) : picked.delete(i); sync(); } });
      boxes.push(box);
      list.append(h("label", { class: "starter" + (exists ? " have" : "") }, box, h("div", null, h("b", null, name),
        h("small", null, [exists ? "Already on your list" : PRIO[prio], k === "funds" ? (price ? "goal " + money(price) : "") : (qty > 1 ? "×" + qty : ""), k !== "funds" && price ? "~" + money(price) : "", tip].filter(Boolean).join(" · ")))));
    }
    block.append(list); body.append(block);
  }
  addBtn.addEventListener("click", async () => {
    addBtn.disabled = true; let n = 0; const total = picked.size; const t0 = Date.now();
    for (const i of picked) {
      const [k, name, qty, prio, price, tip] = STARTER[i];
      const data = k === "funds"
        ? { name, kind: "fund", cat: k, prio, goal: price || 100, qty: 1, notes: tip, links: [], createdAt: t0 + n }
        : { name, kind: "item", cat: k, prio, qty, price: price || null, notes: tip, links: [], size: "", createdAt: t0 + n };
      const ok = await saveItem(null, data); if (!ok) break;
      n++; addBtn.textContent = `Adding ${n} of ${total}…`;
    }
    closeDlg(); if (n) toast(`Added ${plural(n, "item")}. Edit any of them to add links, sizes and photos.`);
  });
  showDlg(h("div", { class: "dlg" }, dlgHead("Quick-add from the checklist", "A starting point built from what new parents actually use. Pick what you want; you can edit everything after."), body,
    h("div", { class: "dlg-foot" }, h("span", { class: "left" }, counter), h("button", { class: "btn", type: "button", onclick: closeDlg }, "Cancel"), addBtn)), true);
}

/* ---------------- dialog plumbing ---------------- */
function dlgHead(title, sub) { return h("div", { class: "dlg-head" }, h("div", null, h("h2", null, title), sub ? h("p", null, sub) : null), h("button", { class: "x", type: "button", "aria-label": "Close", onclick: closeDlg }, "×")); }
function showDlg(content, wide) { const d = $("#dlg"); d.className = wide ? "wide" : ""; d.replaceChildren(content); if (!d.open) d.showModal(); }
function closeDlg() { const d = $("#dlg"); if (d.open) d.close(); d.replaceChildren(); }
$("#dlg").addEventListener("click", (e) => { if (e.target === e.currentTarget) closeDlg(); });

/* ---------------- header mobile (ambient canvas) ---------------- */
(function mobile() {
  const cv = $("#mobile"); const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const shapes = [{ x: .50, len: .30, r: 9, k: "star" }, { x: .56, len: .46, r: 12, k: "moon" }, { x: .62, len: .24, r: 9, k: "cloud" }, { x: .68, len: .40, r: 10, k: "star" }, { x: .74, len: .28, r: 7, k: "moon" }];
  let w = 0, hh = 0;
  const size = () => { const r = cv.getBoundingClientRect(); const d = devicePixelRatio || 1; w = r.width; hh = r.height; cv.width = w * d; cv.height = hh * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  const star = (x, y, r) => { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); };
  const moon = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, Math.PI * .35, Math.PI * 1.65); ctx.arc(x + r * .45, y, r * .78, Math.PI * 1.55, Math.PI * .45, true); ctx.closePath(); ctx.fill(); };
  const cloud = (x, y, r) => { ctx.beginPath(); ctx.arc(x - r * .6, y, r * .6, 0, Math.PI * 2); ctx.arc(x, y - r * .3, r * .75, 0, Math.PI * 2); ctx.arc(x + r * .7, y, r * .55, 0, Math.PI * 2); ctx.fill(); };
  function frame(t) {
    ctx.clearRect(0, 0, w, hh);
    const style = getComputedStyle(document.documentElement);
    const ink = style.getPropertyValue("--band-soft").trim() || "#66769a", cols = ["--accent", "--pink", "--gold"].map((v, k) => style.getPropertyValue(v).trim() || ["#3a6fc4", "#d9779c", "#c9a24a"][k]);
    ctx.strokeStyle = ink; ctx.globalAlpha = .45; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(w * .48, 6); ctx.lineTo(w * .76, 6); ctx.stroke();
    shapes.forEach((s, i) => {
      const sway = reduce ? 0 : Math.sin(t / 1800 + i * 1.3) * 6;
      const x = w * s.x + sway, y = 6 + hh * s.len;
      ctx.globalAlpha = .45; ctx.beginPath(); ctx.moveTo(w * s.x, 6); ctx.lineTo(x, y - s.r); ctx.stroke();
      ctx.globalAlpha = .75; ctx.fillStyle = cols[i % 3];
      (s.k === "star" ? star : s.k === "moon" ? moon : cloud)(x, y, s.r);
    });
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); new ResizeObserver(size).observe(cv.parentElement); requestAnimationFrame(frame);
})();

/* ---------------- boot ---------------- */
async function boot() {
  bindFilters();
  const v = location.hash.slice(1); if (["registry", "mine", "room"].includes(v)) S.view = v;
  render();
  if (!window.claude?.use) { S.offline = true; render(); return; }
  const use = (n) => window.claude.use(n).catch(() => null);
  const [db, user, assets, downloads] = await Promise.all([use("db"), use("user"), use("assets"), use("downloads")]);
  Object.assign(S, { db, user, assets, downloads });
  if (user) {
    const [me, owner, canWrite] = await Promise.all([user.me(), user.isOwner(), user.can("data.write")]);
    S.me = me; S.myId = me.id; S.isOwner = owner; if (canWrite === false) S.readOnly = true;
  }
  if (!db) { S.offline = true; render(); return; }
  if (!S.myId) S.readOnly = true;

  const slowT = setTimeout(() => { S.slow = true; scheduleRender(); }, 10000);
  const settle = (k, snap) => { S.loaded[k] = true; if (!snap.metadata.fromCache) clearTimeout(slowT); };
  const dead = (e) => { console.warn(e); clearTimeout(slowT); S.slow = true; scheduleRender(); };
  db.collection("items").onSnapshot(snap => {
    S.items = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    settle("items", snap); scheduleRender();
  }, dead);
  db.collection("claims").onSnapshot(snap => {
    S.claims = new Map(snap.docs.map(d => [d.id, d.data()]));
    settle("claims", snap); scheduleRender();
  }, dead);
  db.collection("people").onSnapshot(snap => {
    S.people = new Map(snap.docs.map(d => [d.id, d.data()]));
    if (!snap.metadata.fromCache) registerVisit();
    scheduleRender();
  }, dead);
  db.doc("meta/settings").onSnapshot(snap => {
    S.settings = snap.exists ? snap.data() : {};
    settle("settings", snap);
    if (S.view === "room" && !document.activeElement?.closest?.("#room-settings")) roomFormFresh = true;
    scheduleRender();
  }, dead);
  db.doc("meta/thanks").onSnapshot(snap => {
    S.thanks = snap.exists ? snap.data() : { received: {}, sent: {} };
    scheduleRender();
  }, dead);
}
async function registerVisit() {
  if (S.registered || !S.myId || !S.db || S.people.has(S.myId)) { S.registered = S.registered || S.people.has(S.myId); return; }
  S.registered = true;
  try { await S.db.doc("people/" + S.myId).set({ firstSeen: Date.now() }); } catch (e) { if (e?.code === "invalid_argument") { S.readOnly = true; scheduleRender(); } }
}
setInterval(() => { if (S.view === "room") renderFeed(); }, 60000);
addEventListener("nest:state", () => { if (isParent()) { scheduleRender(); if (finderOpen) finderOpen(); } });
boot();
</script>
