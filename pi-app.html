<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Nobody · talk to it</title>
<meta name="description" content="Nobody in the browser: a terse voice assistant with a fluid orb, a voice that degrades instead of going silent, and a handful of real device tools.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="assets/manifests/pi.webmanifest">
<link rel="icon" href="assets/icons/v2/pi.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icons/v2/pi-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nobody"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/pi/pi.css">
</head>
<body>
<header class="top"><b class="logo">P<span>i</span></b><span class="tier" id="tier" title="Which voice is speaking">voice: —</span><span class="grow"></span><button class="ic" id="mute" aria-label="Voice on or off">🔊</button></header>
<main>
  <div class="stage" id="stage"><canvas id="orb" width="560" height="560" aria-hidden="true"></canvas><div class="state" id="state">tap the orb, then talk</div></div>
  <div class="log" id="log" role="log" aria-live="polite"></div>
  <div class="gate" id="gate" hidden></div>
  <form class="say" id="say"><button type="button" class="mic" id="mic" aria-label="Talk">🎙</button><input id="txt" placeholder="Or type to Nobody…" autocomplete="off"><button class="send" aria-label="Send">↑</button></form>
  <div class="tools" id="tools"></div>
</main>
<video id="cam" playsinline muted hidden></video>
<script src="assets/pi/pi.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/pi-sw.js", { scope: "/pi-app" }).catch(() => {});</script>
</body>
</html>
