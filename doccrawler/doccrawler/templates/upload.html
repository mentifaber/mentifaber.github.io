{% extends "base.html" %}
{% block title %}Import - DocCrawler{% endblock %}
{% block content %}
<h1>Import files</h1>
<div class="card">
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="files" multiple>
    <br><br>
    <button type="submit">Upload &amp; ingest</button>
  </form>
  <p class="muted">Supported: .txt, .md, .pdf, .docx, and images (.png/.jpg/...) if OCR is available.</p>
</div>
{% endblock %}
