<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}DocCrawler{% endblock %}</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --text:#e6e6e6; --muted:#9aa1ac; --accent:#5aa9ff; --border:#2a2f3a; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); font-size:16px; overflow-x:hidden; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.6rem 0.75rem;
           display:flex; gap:0.25rem; align-items:center; flex-wrap: wrap; }
  header a { color: var(--text); text-decoration:none; padding: 0.5rem 0.65rem; border-radius:6px;
             min-height:44px; display:inline-flex; align-items:center; }
  header a:hover, header a:active { background: var(--border); }
  header .brand { font-weight:700; color: var(--accent); margin-right: 0.5rem; padding: 0.5rem 0.3rem; }
  main { max-width: 900px; margin: 1rem auto; padding: 0 0.75rem 3rem; width:100%; }
  .card { background: var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:0.9rem 1rem; margin-bottom:1rem; max-width:100%; overflow-wrap: break-word; }
  input[type=text], input[type=file], textarea, select {
    background:#0c0e12; border:1px solid var(--border); color: var(--text);
    padding:0.6rem 0.6rem; border-radius:6px; width:100%; font-size:16px; min-height:44px;
  }
  button, input[type=submit] {
    background: var(--accent); color:#04101f; border:none; padding:0.6rem 1rem;
    border-radius:6px; font-weight:600; cursor:pointer; font-size:1rem; min-height:44px;
  }
  button:hover, input[type=submit]:hover { opacity:0.9; }
  button.danger { background:#e05a5a; color:#2a0808; }
  button.small { min-height:32px; padding:0.2rem 0.5rem; font-size:0.75rem; }
  .muted { color: var(--muted); font-size:0.9rem; }
  .flash { background:#1b2a1e; border:1px solid #2f5a35; padding:0.6rem 0.9rem; border-radius:8px; margin-bottom:1rem; }
  .table-wrap { width:100%; overflow-x:auto; border:1px solid var(--border); border-radius:8px;
                -webkit-overflow-scrolling: touch; }
  table { width:100%; border-collapse: collapse; min-width:480px; }
  th, td { text-align:left; padding:0.5rem 0.5rem; border-bottom:1px solid var(--border);
           vertical-align: top; }
  a.doclink { color: var(--accent); text-decoration:none; }
  a.doclink:hover { text-decoration:underline; }
  .tag { display:inline-block; background:#20262f; border:1px solid var(--border); border-radius: 999px;
         padding:0.2rem 0.6rem; font-size:0.8rem; margin:0.15rem; color: var(--muted); }
  .tag.auto::after { content:" (auto)"; font-size:0.7rem; }
  .tag-list { display:flex; flex-wrap:wrap; gap:0.15rem; max-width: 260px; }
  .excerpt { border-left: 3px solid var(--accent); padding-left:0.75rem; margin:0.75rem 0; }
  form.inline { display:inline; }
  .row { display:flex; gap:0.5rem; flex-wrap: wrap; align-items:center; }
  .pager { display:flex; gap:0.5rem; align-items:center; justify-content:center; margin-top:0.75rem; flex-wrap:wrap; }
  .pager a, .pager span { padding:0.4rem 0.7rem; border-radius:6px; border:1px solid var(--border); text-decoration:none; color:var(--text); }
  .pager .disabled { opacity:0.4; }
  pre { white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; }
  mark { background: #3a3410; color: #ffe58a; border-radius:3px; padding:0 0.1rem; }

  @media (max-width: 640px) {
    main { padding: 0 0.5rem 3rem; }
    .card { padding:0.75rem 0.75rem; }
    header { padding: 0.5rem; gap:0.1rem; }
    header a { padding:0.5rem 0.5rem; font-size:0.95rem; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">DocCrawler</span>
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('upload') }}">Import</a>
  <a href="{{ url_for('library') }}">Library</a>
  <a href="{{ url_for('tags_view') }}">Tags</a>
  <a href="{{ url_for('ask_view') }}">The Librarian</a>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
