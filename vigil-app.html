<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vigil</title>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#000000"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --black: #000000; --panel: #060503; --panel-hi: #0c0a06;
  --gold: #c8a96e; --gold-dim: #8a7050; --gold-hi: #e8cd9a;
  --ember: #b02a1a; --ember-hi: #d94030;
  --ink: #f2e6cf; --ink-soft: #c4b09a; --ink-faint: #7a6e62;
  --line: rgba(200,169,110,.22); --line-soft: rgba(200,169,110,.10);
  --ok: #c8a96e; --warn: #d9a441; --bad: #d94030;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --disp: 'Bricolage Grotesque', sans-serif;
}
html, body { min-height: 100%; background: var(--black); color: var(--ink); font-family: var(--mono); overflow-x: hidden; }
body { font-size: 14px; }
::selection { background: var(--gold); color: var(--black); }

/* ── ambient HUD backdrop ── */
.scanlines { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(200,169,110,.025) 0px, rgba(200,169,110,.025) 1px, transparent 1px, transparent 3px); }
.vignette { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 90% 80% at 50% 40%, transparent 40%, rgba(0,0,0,.75) 100%); }
.gridfloor { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .35;
  background-image: linear-gradient(var(--line-soft) 1px, transparent 1px), linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size: 42px 42px; }
.sweep { position: fixed; left: 0; right: 0; height: 140px; z-index: 2; pointer-events: none;
  background: linear-gradient(180deg, transparent 0%, rgba(200,169,110,.05) 50%, transparent 100%);
  animation: sweepdown 7s linear infinite; }
@keyframes sweepdown { 0% { top: -140px; } 100% { top: 100vh; } }
.corner-bracket { position: fixed; width: 26px; height: 26px; border-color: var(--gold-dim); z-index: 30; opacity: .7; pointer-events: none;
  animation: bracketPulse 5s ease-in-out infinite; }
.cb-tl { top: 14px; left: 14px; border-top: 1px solid; border-left: 1px solid; }
.cb-tr { top: 14px; right: 14px; border-top: 1px solid; border-right: 1px solid; }
.cb-bl { bottom: 14px; left: 14px; border-bottom: 1px solid; border-left: 1px solid; }
.cb-br { bottom: 14px; right: 14px; border-bottom: 1px solid; border-right: 1px solid; }
@keyframes bracketPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

/* ── threat index gauge ── */
.threat-gauge { position: relative; width: 52px; height: 52px; flex-shrink: 0; cursor: default; }
.threat-gauge svg { width: 100%; height: 100%; }
.tg-track { fill: none; stroke: var(--line); stroke-width: 4; }
.tg-arc { fill: none; stroke-width: 4; stroke-linecap: round; transform-origin: center; transform: rotate(-90deg);
  transition: stroke-dashoffset .9s cubic-bezier(.4,0,.2,1), stroke .5s ease; }
.tg-readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.tg-readout b { font-size: 15px; line-height: 1; font-weight: 700; transition: color .5s ease; }
.tg-readout span { font-size: 6.5px; letter-spacing: .1em; color: var(--ink-faint); margin-top: 2px; text-transform: uppercase; }
@media (max-width: 600px) { .threat-gauge { order: 5; margin: 0 auto; } }

/* ── radial gauge (generic, used in HUD panels) ── */
.rgauge { position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.rgauge svg { width: 100%; height: 100%; }
.rgauge .rg-track { fill: none; stroke: var(--line); }
.rgauge .rg-arc { fill: none; stroke-linecap: round; transform-origin: center; transform: rotate(-90deg);
  transition: stroke-dashoffset .8s cubic-bezier(.4,0,.2,1), stroke .5s ease; }
.rgauge .rg-readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.rgauge .rg-readout b { line-height: 1; font-weight: 700; }
.rgauge .rg-readout span { display: block; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }

/* ── JARVIS command console ── */
.jarvis-console { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px));
  background: rgba(6,5,3,.92); border: 1px solid var(--gold-dim); box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 12px 40px rgba(0,0,0,.7), 0 0 24px rgba(200,169,110,.12);
  z-index: 200; font-family: var(--mono); backdrop-filter: blur(6px); }
.jarvis-console::before { content: "JARVIS CONSOLE"; display: block; padding: .5rem .8rem; font-size: 9px; letter-spacing: .2em;
  color: var(--gold-dim); border-bottom: 1px solid var(--line-soft); }
.jc-log { max-height: 220px; overflow-y: auto; padding: .6rem .8rem; font-size: 11.5px; line-height: 1.7; }
.jc-log::-webkit-scrollbar { width: 5px; } .jc-log::-webkit-scrollbar-thumb { background: var(--line); }
.jc-line { color: var(--ink-soft); white-space: pre-wrap; word-break: break-word; }
.jc-line.jc-echo { color: var(--gold-hi); }
.jc-line.jc-err { color: var(--ember-hi); }
.jc-inputrow { display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; border-top: 1px solid var(--line-soft); }
.jc-prompt { color: var(--gold); font-weight: 700; }
.jc-inputrow input { flex: 1; background: transparent; border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 12.5px; }
.jc-inputrow input::placeholder { color: var(--ink-faint); }

@keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
@keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
.glow { text-shadow: 0 0 8px rgba(200,169,110,.55), 0 0 22px rgba(200,169,110,.25); }
.glow-ember { text-shadow: 0 0 8px rgba(217,64,48,.6), 0 0 22px rgba(217,64,48,.3); }

/* ── lock ── */
.lock-wrap { max-width: 420px; margin: 0 auto; padding: 18vh 24px 10vh; position: relative; z-index: 5; min-height: 100vh;
  display: flex; align-items: center; }
.lock-card { width: 100%; position: relative; background: linear-gradient(135deg, rgba(200,169,110,.4), rgba(200,169,110,.06) 45%, rgba(176,42,26,.3));
  padding: 1px; clip-path: polygon(0 18px, 18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); }
.lock-card-inner { background: var(--panel); padding: 2.6rem 2.2rem;
  clip-path: polygon(0 17px, 17px 0, 100% 0, 100% calc(100% - 17px), calc(100% - 17px) 100%, 0 100%); }
.lock-eyebrow { font-size: 10px; letter-spacing: .34em; text-transform: uppercase; color: var(--ember-hi); margin-bottom: .9rem; }
.lock-eyebrow .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ember-hi); margin-right: .6em;
  animation: pulse 1.6s ease-in-out infinite; }
.lock-card h3 { font-family: var(--disp); font-weight: 700; font-size: 1.55rem; color: var(--ink); margin-bottom: .6rem; letter-spacing: -.01em; }
.lock-card p.lock-desc { color: var(--ink-faint); font-size: .82rem; line-height: 1.7; margin-bottom: 1.8rem; }
.lock-field { margin-bottom: 1.1rem; text-align: left; }
.lock-field label { display: block; font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: .5rem; }
.lock-field input { width: 100%; padding: .8rem .9rem; border: 1px solid var(--line); background: #0a0805; color: var(--gold-hi);
  font-size: 16px; font-family: var(--mono); }
.lock-field input:focus { outline: none; border-color: var(--gold); }
.lock-enter { width: 100%; padding: .9rem; border: 1px solid var(--gold-dim); font-weight: 600;
  font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); cursor: pointer; margin-top: .5rem;
  background: transparent; transition: .25s; font-family: var(--mono); }
.lock-enter:hover { border-color: var(--gold); background: rgba(200,169,110,.08); color: var(--gold-hi); }
.lock-error { color: var(--ember-hi); font-size: 11px; margin-top: 1rem; min-height: 1.4em; letter-spacing: .03em; }
.lock-shake { animation: lockshake .35s; }
@keyframes lockshake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

/* ── boot sequence ── */
#boot { display: none; position: fixed; inset: 0; z-index: 90; background: var(--black); flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; }
#boot.show { display: flex; }
#bootCanvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .55; }
.boot-wrap { width: min(92vw, 620px); position: relative; z-index: 1; }
.boot-title { font-family: var(--disp); font-weight: 800; font-size: clamp(2rem, 9vw, 3.1rem); color: var(--gold);
  letter-spacing: -.02em; text-align: center; line-height: 1;
  text-shadow: 0 0 14px rgba(200,169,110,.6), 0 0 40px rgba(200,169,110,.28); }
.boot-title span { display: inline-block; opacity: 0; transform: translateY(14px); animation: bootLetter .5s forwards; }
@keyframes bootLetter { to { opacity: 1; transform: translateY(0); } }
.boot-sub { text-align: center; font-size: 9px; letter-spacing: .42em; text-transform: uppercase;
  color: var(--ink-faint); margin: .8rem 0 1.8rem; }
.boot-sub b { color: var(--ember-hi); }
.boot-lines { min-height: 210px; font-size: 11.5px; line-height: 1.95; color: var(--ink-faint); }
.boot-lines .ln { opacity: 0; transform: translateX(-8px); transition: opacity .18s, transform .18s;
  display: flex; justify-content: space-between; gap: 1rem; border-bottom: 1px solid rgba(200,169,110,.05); }
.boot-lines .ln.in { opacity: 1; transform: translateX(0); }
.boot-lines .ln b { color: var(--gold); font-weight: 600; }
.boot-lines .ln .ok { color: var(--gold); text-shadow: 0 0 8px rgba(200,169,110,.7); }
.boot-lines .ln .ok::before { content: "▮ "; }
.boot-bar { margin-top: 1.6rem; height: 4px; background: var(--line-soft); position: relative; overflow: hidden; }
.boot-bar i { position: absolute; inset: 0; width: 0%; background: linear-gradient(90deg, var(--ember), var(--gold), var(--gold-hi));
  box-shadow: 0 0 12px rgba(200,169,110,.8); transition: width .28s linear; }
.boot-pct { display: flex; justify-content: space-between; margin-top: .5rem; font-size: 9px;
  letter-spacing: .18em; color: var(--ink-faint); text-transform: uppercase; }
.boot-pct b { color: var(--gold); }
.boot-skip { margin-top: 1.4rem; text-align: center; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }
.boot-skip i { display: inline-block; width: 6px; height: 6px; background: var(--ember-hi); border-radius: 50%;
  margin-right: .5em; animation: pulse 1.2s ease-in-out infinite; }

/* ── dashboard shell ── */
#dash { display: none; position: relative; z-index: 5; min-height: 100vh; }
#dash.show { display: block; }

.topbar { position: sticky; top: 0; z-index: 20; background: rgba(6,5,3,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
.ticker-wrap { overflow: hidden; border-bottom: 1px solid var(--line-soft); height: 28px; display: flex; align-items: center; }
.ticker { display: flex; gap: 3rem; white-space: nowrap; animation: marquee 38s linear infinite; padding-left: 100%; }
.ticker span { font-size: 10.5px; letter-spacing: .06em; color: var(--ink-soft); }
.ticker span b { color: var(--gold); font-weight: 600; }
.ticker span.up { color: var(--gold); } .ticker span.down { color: var(--ember-hi); }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }

.hdr { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .9rem 1.3rem; flex-wrap: wrap; }
.hdr-brand { display: flex; align-items: center; gap: .9rem; }
.hdr-title { font-family: var(--disp); font-weight: 800; font-size: 1.4rem; color: var(--gold); letter-spacing: .01em; position: relative; }
.hdr-sub { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-faint); margin-top: 2px; }
.hdr-status { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.hdr-status b { color: var(--gold); }
.hdr-clock { text-align: right; }
.hdr-time { font-family: var(--disp); font-weight: 700; font-size: 1.6rem; color: var(--ink); letter-spacing: .02em; }
.hdr-date { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.hdr-actions { display: flex; align-items: center; gap: .5rem; }
.hud-btn { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-dim);
  background: transparent; border: 1px solid var(--line); padding: .5rem .7rem; cursor: pointer; text-decoration: none; transition: .2s; }
.hud-btn:hover { color: var(--gold); border-color: var(--gold-dim); background: rgba(200,169,110,.06); }

.worldclocks { display: flex; gap: 1.6rem; padding: 0 1.3rem .8rem; flex-wrap: wrap; border-bottom: 1px solid var(--line-soft); }
.wc { font-size: 10px; color: var(--ink-faint); letter-spacing: .04em; }
.wc b { color: var(--ink-soft); font-weight: 600; display: block; font-size: 12px; margin-top: 1px; }

/* ── grid ── */
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1px; background: var(--line-soft); padding: 1px; }
.hud-panel { background: var(--panel); position: relative; min-height: 220px; display: flex; flex-direction: column; }
.hud-panel.span2 { grid-column: span 2; }
@media (max-width: 900px) { .hud-panel.span2 { grid-column: span 1; } }

.cat-header { grid-column: 1 / -1; display: flex; align-items: center; gap: 1rem; padding: 1.8rem 1.1rem .6rem; background: var(--black); }
.cat-header:first-child { padding-top: .3rem; }
.cat-header .cat-num { font-family: var(--disp); font-size: .78rem; color: var(--ember-hi); font-weight: 700; letter-spacing: .05em; }
.cat-header .cat-label { font-family: var(--disp); font-weight: 700; font-size: 1.05rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.cat-header .cat-sub { font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
.cat-header .cat-rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
@media (max-width: 900px) { .cat-header .cat-label { font-size: .92rem; } .cat-header .cat-sub { display: none; } }

.ph { display: flex; align-items: center; justify-content: space-between; padding: .9rem 1.1rem; border-bottom: 1px solid var(--line-soft); gap: .8rem; }
.ph-title { font-size: 14px; letter-spacing: .04em; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: .6em; }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
.status-dot.ok { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.status-dot.bad { background: var(--ember-hi); box-shadow: 0 0 6px var(--ember-hi); }
.status-dot.pending { background: var(--ink-faint); animation: pulse 1.2s ease-in-out infinite; }
.ph-meta { font-size: 10.5px; color: var(--ink-faint); letter-spacing: .05em; text-align: right; }
@media (max-width: 900px) { .ph-title { font-size: 13px; } .ph-meta { font-size: 9.5px; } }
.pb { padding: 1rem 1.1rem; flex: 1; overflow: auto; }
.pb::-webkit-scrollbar { width: 5px; } .pb::-webkit-scrollbar-thumb { background: var(--line); }

.readout { font-family: var(--disp); font-weight: 700; font-size: 2.1rem; color: var(--ink); line-height: 1; }
.readout small { font-family: var(--mono); font-size: .9rem; color: var(--ink-faint); font-weight: 400; }
.subrow { display: flex; gap: 1.4rem; margin-top: .7rem; flex-wrap: wrap; }
.subrow div { font-size: 10px; color: var(--ink-faint); }
.subrow div b { display: block; color: var(--ink-soft); font-size: 12px; margin-top: 1px; font-weight: 600; }
.searchrow { display: flex; gap: .4rem; margin-bottom: .9rem; }
.searchrow input { flex: 1; min-width: 0; padding: .65rem .7rem; background: #0a0805; border: 1px solid var(--line); color: var(--ink); font-family: var(--mono); font-size: 16px; }
.searchrow input:focus { outline: none; border-color: var(--gold-dim); }
.searchrow button { padding: .65rem .9rem; min-height: 40px; background: transparent; border: 1px solid var(--line); color: var(--gold-dim); cursor: pointer; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; flex-shrink: 0; }
.searchrow button:hover { color: var(--gold); border-color: var(--gold-dim); }

.evt-item { padding: .7rem 0; border-top: 1px solid var(--line-soft); font-size: 11.5px; line-height: 1.6; color: var(--ink-soft); }
.evt-item:first-child { border-top: none; }
.evt-item a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
.evt-item a:hover { color: var(--gold-hi); }

.quake-list { list-style: none; font-size: 11px; }
.quake-list li { display: grid; grid-template-columns: 40px 1fr auto; gap: .6rem; padding: .5rem 0; border-top: 1px solid var(--line-soft); align-items: baseline; }
.quake-list li:first-child { border-top: none; }
.qmag { font-family: var(--disp); font-weight: 700; color: var(--ember-hi); }
.qmag.mod { color: var(--gold); }
.qloc { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qtime { color: var(--ink-faint); font-size: 9.5px; white-space: nowrap; }
.quake-detail { padding: .7rem 1.1rem; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-soft); display: none; }
.quake-detail.show { display: block; }
.quake-detail .qmag { font-family: var(--disp); font-weight: 700; color: var(--ember-hi); margin-right: .5rem; }
.quake-detail .qmag.mod { color: var(--gold); }
.quake-detail .qloc { color: var(--ink); font-weight: 600; }
.quake-detail .qtime { color: var(--ink-faint); font-size: 9.5px; }
.quake-list li.selected { background: rgba(200,169,110,.12); border-left: 2px solid var(--gold); padding-left: calc(.5rem - 2px); }
.magfilter { display: flex; gap: .4rem; padding: .6rem 1.1rem; border-top: 1px solid var(--line-soft); }
.magfilter button { flex: 1; padding: .4rem; background: transparent; border: 1px solid var(--line); color: var(--ink-faint); cursor: pointer; font-family: var(--mono); font-size: 9.5px; }
.magfilter button.on { color: var(--gold); border-color: var(--gold-dim); }

.cryptorow { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .9rem; }
.ccard { border: 1px solid var(--line-soft); padding: .7rem .8rem; }
.ccard .sym { font-size: 9.5px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
.ccard .px { font-family: var(--disp); font-weight: 700; font-size: 1.15rem; color: var(--ink); margin-top: .2rem; }
.ccard .chg { font-size: 10px; margin-top: .2rem; }
.fxtable { width: 100%; border-collapse: collapse; font-size: 11px; }
.fxtable td { padding: .35rem 0; border-top: 1px solid var(--line-soft); color: var(--ink-soft); }
.fxtable td:last-child { text-align: right; color: var(--gold); font-weight: 600; }

.launch-item { padding: .7rem 0; border-top: 1px solid var(--line-soft); }
.launch-item:first-child { border-top: none; }
.launch-name { font-size: 12px; color: var(--ink); font-weight: 600; }
.launch-meta { font-size: 10px; color: var(--ink-faint); margin-top: .25rem; }
.launch-t { color: var(--gold); }

.apod-img { width: 100%; display: block; border: 1px solid var(--line-soft); margin-bottom: .8rem; }
.apod-title { font-size: 12.5px; color: var(--ink); font-weight: 600; margin-bottom: .4rem; }
.apod-text { font-size: 10.5px; color: var(--ink-faint); line-height: 1.6; max-height: 5.6em; overflow: hidden; cursor: pointer; }
.apod-text.open { max-height: none; }

.notes-area { width: 100%; min-height: 160px; background: #0a0805; border: 1px solid var(--line); color: var(--ink);
  font-family: var(--mono); font-size: 16px; padding: .8rem; resize: vertical; line-height: 1.6; }
.notes-area:focus { outline: none; border-color: var(--gold-dim); }
.notes-meta { font-size: 9px; color: var(--ink-faint); margin-top: .5rem; letter-spacing: .06em; }

.err-msg { color: var(--ink-faint); font-size: 10.5px; font-style: normal; padding: .5rem 0; }
.moonrow { display: flex; align-items: center; gap: .7rem; margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--line-soft); }
.moon-emoji { font-size: 1.6rem; }
.key-hint { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1rem; padding: 1.4rem 1rem .2rem;
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.key-hint b { color: var(--gold); font-weight: 600; border: 1px solid var(--line); padding: .15em .45em; margin-right: .4em; }
@media (max-width: 600px) { .key-hint { display: none; } }
.footer-note { text-align: center; padding: 2.5rem 1rem 3rem; font-size: 9.5px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }

/* ── globe ── */
.globe-panel { grid-column: 1 / -1; }
.globe-layout { display: grid; grid-template-columns: 1fr 320px; }

.globe-stage { position: relative; overflow: hidden; border-right: 1px solid var(--line-soft);

@media (max-width: 900px) { .globe-stage { border-right: none; border-bottom: 1px solid var(--line-soft); aspect-ratio: 1 / 1; } }
.globe-stage canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.globe-stage canvas.grabbing { cursor: grabbing; }
.globe-corner { position: absolute; font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-faint); pointer-events: none; z-index: 2; }
.globe-corner.tl { top: .7rem; left: .85rem; } .globe-corner.tr { top: .7rem; right: .85rem; text-align: right; }
.globe-corner.bl { bottom: .7rem; left: .85rem; } .globe-corner.br { bottom: .7rem; right: .85rem; text-align: right; }
.globe-corner b { color: var(--gold); font-weight: 600; }
.globe-ctrls { position: absolute; bottom: .7rem; left: 50%; transform: translateX(-50%); display: flex; gap: .3rem; z-index: 3; }
.globe-ctrls button { font-family: var(--mono); font-size: 11px; line-height: 1; width: 30px; height: 30px; cursor: pointer;
  background: rgba(6,5,3,.85); border: 1px solid var(--line); color: var(--gold-dim); }
.globe-ctrls button:hover { color: var(--gold); border-color: var(--gold-dim); }
.globe-ctrls button.on { color: var(--gold); border-color: var(--gold-dim); background: rgba(200,169,110,.12); }
.globe-side { display: flex; flex-direction: column; min-width: 0; }
.layer-chips { display: flex; flex-wrap: wrap; gap: .35rem; padding: .75rem; border-bottom: 1px solid var(--line-soft); }
.layer-chip { display: inline-flex; align-items: center; gap: .45em; font-family: var(--mono); font-size: 8.5px;
  letter-spacing: .12em; text-transform: uppercase; background: transparent; border: 1px solid var(--line);
  color: var(--ink-faint); padding: .4rem .5rem; cursor: pointer; min-height: 30px; transition: .18s; }
.layer-chip .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
.layer-chip.on { color: var(--ink-soft); border-color: var(--gold-dim); background: rgba(200,169,110,.07); }
.layer-chip .cnt { color: var(--ink-faint); font-size: 8px; }
.globe-readout { padding: .9rem; flex: 1; overflow: auto; font-size: 11px; }
.gr-empty { color: var(--ink-faint); font-size: 10.5px; line-height: 1.7; }
.gr-kind { font-size: 8.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--ember-hi); margin-bottom: .5rem; }
.gr-title { font-family: var(--disp); font-weight: 700; font-size: 1.05rem; color: var(--ink); line-height: 1.3; margin-bottom: .5rem; }
.gr-rows { display: grid; grid-template-columns: auto 1fr; gap: .3rem .8rem; font-size: 10px; margin-top: .7rem; }
.gr-rows dt { color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; }
.gr-rows dd { color: var(--ink-soft); }
.gr-link { display: inline-block; margin-top: .8rem; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }

/* ── space weather ── */
.kp-scale { display: flex; gap: 2px; margin: .8rem 0 .5rem; }
.kp-cell { flex: 1; height: 26px; background: var(--line-soft); border: 1px solid transparent; position: relative; }
.kp-cell.fill { background: var(--gold-dim); } .kp-cell.fill.storm { background: var(--ember); }
.kp-cell.cur { border-color: var(--gold-hi); box-shadow: 0 0 8px rgba(200,169,110,.5); }
.kp-axis { display: flex; justify-content: space-between; font-size: 8px; color: var(--ink-faint); letter-spacing: .1em; }
.sw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: .9rem; margin-top: 1rem; }
.sw-cell { font-size: 9.5px; color: var(--ink-faint); letter-spacing: .06em; }
.sw-cell b { display: block; font-family: var(--disp); font-size: 1.15rem; color: var(--ink); font-weight: 700; margin-top: 2px; letter-spacing: 0; }

/* ── diagnostics ── */
.diag-table { width: 100%; border-collapse: collapse; font-size: 10px; }
.diag-table th { text-align: left; font-size: 8.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 400; padding: .35rem .5rem .35rem 0; border-bottom: 1px solid var(--line-soft); }
.diag-table td { padding: .45rem .5rem .45rem 0; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); vertical-align: top; }
.diag-table td.name { color: var(--ink); white-space: nowrap; }
.diag-table td.host { color: var(--ink-faint); font-size: 9px; word-break: break-all; }
.diag-ok { color: var(--gold); } .diag-bad { color: var(--ember-hi); } .diag-wait { color: var(--ink-faint); }
.diag-note { font-size: 9.5px; color: var(--ink-faint); line-height: 1.7; margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--line-soft); }


/* ── weather upgrades ── */
.wx-places { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .8rem; }
.wx-places:empty { display: none; }
.wx-chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); font-family: var(--mono); font-size: 10px; letter-spacing: .06em; cursor: pointer; }
button.wx-chip, .wx-chip button { padding: .45rem .6rem; min-height: 32px; background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; }
.wx-chip button[data-act="del"] { padding: .45rem .5rem; color: var(--ink-faint); border-left: 1px solid var(--line-soft); }
.wx-chip.on { border-color: var(--gold); color: var(--gold-hi); background: rgba(200,169,110,.08); }

.wx-toprow { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }

.wx-units button.on { background: var(--gold); color: #0b0906; }
.wx-summary { margin: .7rem 0 .2rem; font-family: 'Newsreader', Georgia, serif; font-size: 14px; line-height: 1.45; color: var(--ink); }
.wx-now { display: inline-block; margin-top: .45rem; font-size: 10.5px; letter-spacing: .04em; padding: .3rem .55rem; border: 1px solid var(--line-soft); }
.wx-now.wet { color: #9ad6ef; border-color: rgba(126,200,227,.45); background: rgba(126,200,227,.08); }
.wx-now.dry { color: var(--ink-faint); }
.wx-grid { display: grid !important; grid-template-columns: repeat(3, 1fr); gap: .75rem 1rem !important; }
.wx-grid b i { font-style: normal; font-weight: 400; color: var(--ink-faint); font-size: 10px; }
.wx-arrow { display: inline-block; margin-right: .2rem; color: var(--gold); }
.wx-trend { color: var(--gold); }
.wx-chart-wrap { overflow-x: auto; scrollbar-width: thin; padding-bottom: .3rem; }
.wx-chart { display: block; font-family: var(--mono); }
.wx-chart .wc-night { fill: rgba(80,100,160,.09); }
.wx-chart .wc-pop { fill: #7ec8e3; }
.wx-chart .wc-line { fill: none; stroke: var(--gold-hi); stroke-width: 2; filter: drop-shadow(0 0 4px rgba(200,169,110,.7)); }
.wx-chart .wc-dot { fill: var(--gold-hi); }
.wx-chart .wc-deg { fill: var(--ink); font-size: 10.5px; font-weight: 600; text-anchor: middle; }
.wx-chart .wc-hr { fill: var(--ink-faint); font-size: 9px; text-anchor: middle; }
.wx-chart .wc-ico { font-size: 11px; text-anchor: middle; }
.wx-chart .wc-pct { fill: #9ad6ef; font-size: 8.5px; text-anchor: middle; }
.wx-chart .wc-sun { fill: var(--gold-dim); font-size: 8.5px; }
.wx-chart .wc-day { fill: var(--gold); font-size: 9px; letter-spacing: .1em; }
.wx-chart .wc-mid { stroke: var(--line); stroke-dasharray: 2 3; }
.hr-feel { font-size: 8px; color: var(--ink-faint); }
.hr-wind { font-size: 9px; color: var(--ink-soft); }
.hr-wind small { font-size: 7px; color: var(--ink-faint); margin-left: 1px; }
button.fc-cell { font: inherit; color: inherit; cursor: pointer; }
.fc-cell.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px -4px rgba(200,169,110,.6); }
.fc-conf { font-size: 8px; margin-top: .15rem; }
.fc-conf.hi { color: #8fcf8a; } .fc-conf.mid { color: var(--warn); } .fc-conf.lo { color: var(--ember-hi); }
.wx-day { margin-top: 1rem; border-top: 1px solid var(--line-soft); padding-top: .9rem; }
.wx-day:empty { display: none; }
.wx-day-head { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-family: var(--disp); font-size: 15px; color: var(--gold-hi); margin-bottom: .6rem; }
.wx-day-grid { display: grid !important; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: .7rem 1rem !important; margin-bottom: .9rem; }

.wx-phone { display: inline-block; margin-top: .8rem; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-dim); text-decoration: none; border-bottom: 1px solid var(--line); }
.wx-phone:hover { color: var(--gold); }
.wx-day-note { font-size: 10px; color: var(--ink-faint); }

/* ── forecast ── */
.fc-label { font-size: 8.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: .6rem; }
.hourly-strip, .forecast-strip { display: flex; gap: .3rem; overflow-x: auto; padding-bottom: .5rem; scrollbar-width: thin; }

.hourly-strip::-webkit-scrollbar-thumb, .forecast-strip::-webkit-scrollbar-thumb { background: var(--line); }
.hr-cell { flex: 0 0 46px; text-align: center; padding: .4rem .1rem; border: 1px solid transparent; }
.hr-t { font-size: 8.5px; color: var(--ink-faint); letter-spacing: .04em; }

.hr-bar { height: 34px; display: flex; align-items: flex-end; justify-content: center; }
.hr-bar span { display: block; width: 3px; min-height: 2px; background: linear-gradient(180deg, var(--gold-hi), var(--gold-dim)); box-shadow: 0 0 6px rgba(200,169,110,.6); }
.hr-deg { font-size: 11px; color: var(--ink); font-weight: 600; margin-top: .25rem; }
.hr-pop { font-size: 8px; color: #7ec8e3; min-height: 1em; }
.fc-cell { flex: 0 0 58px; text-align: center; padding: .5rem .15rem; border: 1px solid var(--line-soft); background: rgba(200,169,110,.02); }
.fc-cell.today { border-color: var(--gold-dim); background: rgba(200,169,110,.08); }

.fc-date { font-size: 8px; color: var(--ink-faint); margin-bottom: .2rem; }
.fc-ico { font-size: 15px; line-height: 1.6; }
.fc-hi { font-size: 12px; color: var(--ink); font-weight: 600; }
.fc-track { position: relative; height: 42px; width: 3px; margin: .25rem auto; background: var(--line-soft); }
.fc-track span { position: absolute; left: 0; width: 3px; background: linear-gradient(180deg, var(--ember-hi), var(--gold), var(--gold-dim));
  box-shadow: 0 0 7px rgba(200,169,110,.55); }
.fc-lo { font-size: 11px; color: var(--ink-faint); }
.fc-pop { font-size: 8px; color: #7ec8e3; margin-top: .2rem; }

/* ── radar ── */
.radar-wrap { position: relative; background: #050403; aspect-ratio: 16 / 10; overflow: hidden; }
.radar-wrap canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.radar-bar { display: flex; align-items: center; gap: .6rem; padding: .6rem .9rem; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.radar-bar button { font-family: var(--mono); font-size: 10px; min-height: 34px; min-width: 34px; cursor: pointer;

.radar-scrub { flex: 1 1 130px; min-width: 110px; accent-color: var(--gold); }

/* ── conflict feed ── */

.cf-item { display: grid; grid-template-columns: auto 1fr; gap: .7rem; padding: .6rem 0; border-top: 1px solid var(--line-soft); font-size: 11px; align-items: baseline; }
.cf-item:first-child { border-top: none; }

.cf-item a { color: var(--ink-soft); text-decoration: none; line-height: 1.55; }
.cf-item a:hover { color: var(--gold); }
.volc-item { display: grid; grid-template-columns: auto 1fr; gap: .7rem; padding: .6rem 0; border-top: 1px solid var(--line-soft); font-size: 11px; align-items: baseline; }
.volc-item:first-child { border-top: none; }
.volc-item .volc-level { font-size: 8.5px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; padding: .15rem .4rem; border: 1px solid currentColor; }
.volc-item .volc-name { color: var(--ink-soft); }
.volc-item .volc-meta { display: block; font-size: 9px; color: var(--ink-faint); margin-top: .2rem; letter-spacing: .04em; }
.volc-item a { color: inherit; text-decoration: none; }
.volc-item a:hover .volc-name { color: var(--gold); }

.sat-item { padding: .5rem 0; border-bottom: 1px solid var(--line-soft); font-size: 11px; }

.sat-name { color: var(--ink-soft); font-weight: 600; letter-spacing: .04em; }
.sat-meta { display: block; font-size: 9.5px; color: var(--ink-faint); margin-top: .2rem; letter-spacing: .04em; }

@media (max-width: 600px) {
  body { font-size: 13px; }
  .hdr { padding: .8rem 1rem; gap: .7rem; }

  .magfilter { padding: .6rem .9rem; gap: .35rem; }
  .magfilter button { padding: .6rem .3rem; min-height: 38px; font-size: 9px; }
  .searchrow { flex-wrap: nowrap; }
  .quake-list li { grid-template-columns: 34px 1fr; row-gap: .1rem; }
  .quake-list .qtime { grid-column: 2; }
  .readout { font-size: 1.8rem; }
  .lock-wrap { padding: 12vh 18px 8vh; }
  .lock-card-inner { padding: 2rem 1.6rem; }
  .layer-chips { padding: .6rem; gap: .3rem; }
  .layer-chip { font-size: 8px; padding: .4rem .45rem; min-height: 34px; }
  .globe-corner { font-size: 7.5px; }
  .globe-ctrls button { width: 34px; height: 34px; }
  .gr-title { font-size: .98rem; }
  .diag-table td.host { display: none; } .diag-table th.host { display: none; }
}
@supports (padding: max(0px)) {
  .cb-tl, .cb-tr { top: max(14px, env(safe-area-inset-top)); }

}

<script>
(function () {
  "use strict";
  var ITER = 600000, KEY_STORE = "vigil-key";
  var user = document.getElementById("vg-user"), pass = document.getElementById("vg-pass");
  var btn = document.getElementById("vg-submit"), err = document.getElementById("vg-error");
  var card = document.querySelector(".lock-card");
  var raw = Uint8Array.from(atob(document.getElementById("vg-blob").textContent.replace(/\s+/g, "")), function (c) { return c.charCodeAt(0); });
  var salt = raw.subarray(0, 16), iv = raw.subarray(16, 28), ct = raw.subarray(28);
  var subtle = window.crypto && window.crypto.subtle;
  try { localStorage.removeItem("vigil-auth"); } catch (e) {}

  function b64(buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function unb64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  function open(key) {
    return subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct).then(function (pt) {
      var gz = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
      return new Response(gz).text();
    }).then(function (html) {
      document.open(); document.write(html); document.close();
    });
  }
  function importRaw(bytes) { return subtle.importKey("raw", bytes, { name: "AES-GCM" }, true, ["decrypt"]); }

  function deny(msg) {
    err.textContent = msg; btn.disabled = false; btn.textContent = "Authenticate";
    card.classList.remove("lock-shake"); void card.offsetWidth; card.classList.add("lock-shake");
  }
  function attempt() {
    if (!subtle || !window.DecompressionStream) { deny("This browser can't open Vigil — use a current Chrome, Safari or Firefox over https."); return; }
    if (!user.value.trim() || !pass.value) { deny("Operator and access code required."); return; }
    btn.disabled = true; btn.textContent = "Verifying…"; err.textContent = "";
    subtle.importKey("raw", new TextEncoder().encode(user.value.trim() + "\u0000" + pass.value), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      })
      .then(function (key) {
        return subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct).then(function () { return key; });
      })
      .then(function (key) {
        return subtle.exportKey("raw", key).then(function (k) {
          try { localStorage.setItem(KEY_STORE, b64(k)); } catch (e) {}
          return open(key);
        });
      })
      .catch(function () { pass.value = ""; deny("Access denied. Try again."); });
  }
  btn.addEventListener("click", attempt);
  pass.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
  user.addEventListener("keydown", function (e) { if (e.key === "Enter") pass.focus(); });

  // Remembered device: the stored key only opens this exact ciphertext, and
  // is useless once the page is resealed with new credentials.
  var saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (saved && subtle && window.DecompressionStream) {
    importRaw(unb64(saved)).then(open).catch(function () { try { localStorage.removeItem(KEY_STORE); } catch (e) {} });
  }
})();
</script>
