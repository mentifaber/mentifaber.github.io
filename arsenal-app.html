<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mechanic's Arsenal</title>
<link rel="icon" href="assets/icons/arsenal.png">
<link rel="apple-touch-icon" href="assets/icons/arsenal.png">
<link rel="manifest" href="assets/manifests/arsenal.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mechanic's Arsenal">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#04050a;
  --panel:#070912;
  --panel2:#0b0e1a;
  --line:rgba(0,240,255,.14);
  --line-strong:rgba(0,240,255,.38);
  --text:#e6fbff;
  --muted:#7f93a8;
  --cyan:#00f0ff;
  --mag:#ff2bd6;
  --yel:#f7e94a;
  --accent:var(--cyan);
  --accent-ink:#001417;
  --chip:#0c1020;
  --display:'Orbitron','Arial Black',sans-serif;
  --body:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Share Tech Mono',ui-monospace,Menlo,Consolas,monospace;
  --cut:10px;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:500 15px/1.35 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
#app{height:100%;height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
/* ---------- stage */
#stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#2a3038 0%,#12151a 55%,#07080a 100%);transition:background .6s}
#stage.env-cyber{background:radial-gradient(ellipse at 50% 108%,rgba(255,43,214,.30),transparent 55%),radial-gradient(ellipse at 15% 0%,rgba(0,240,255,.20),transparent 50%),linear-gradient(#050612,#0b0520 60%,#12041c)}
#stage.env-sunset{background:linear-gradient(#171a3d 0%,#5d3559 34%,#d9834a 58%,#3a2230 60%,#120c10 100%)}
#stage.env-overcast{background:linear-gradient(#d3dae0,#aeb7be 58%,#737b81)}
#stage.env-night{background:radial-gradient(circle at 18% 34%,rgba(255,170,80,.35) 0 3px,transparent 26px),radial-gradient(circle at 78% 30%,rgba(255,70,150,.30) 0 3px,transparent 30px),radial-gradient(circle at 64% 42%,rgba(90,200,255,.28) 0 3px,transparent 26px),linear-gradient(#04060d,#0b1226 55%,#170f2d)}
#stage.env-garage{background:repeating-linear-gradient(90deg,rgba(210,225,255,.10) 0 90px,transparent 90px 220px) top/100% 22% no-repeat,linear-gradient(#16191d,#0a0b0d)}
#stage.env-studio{background:radial-gradient(ellipse at 50% 30%,#2a3038 0%,#12151a 55%,#07080a 100%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.5) 100%)}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply;opacity:.55}
.photo #scan,.noscan #scan{display:none}
.hudframe i{position:absolute;width:22px;height:22px;border:2px solid var(--cyan);pointer-events:none;opacity:.8;filter:drop-shadow(0 0 4px var(--cyan))}
.hudframe .tl{left:8px;top:8px;border-right:0;border-bottom:0}
.hudframe .tr{right:8px;top:8px;border-left:0;border-bottom:0}
.hudframe .bl{left:8px;bottom:8px;border-right:0;border-top:0;border-color:var(--mag);filter:drop-shadow(0 0 4px var(--mag))}
.hudframe .br{right:8px;bottom:8px;border-left:0;border-top:0;border-color:var(--mag);filter:drop-shadow(0 0 4px var(--mag))}
.brand{position:absolute;left:18px;top:16px;pointer-events:none;max-width:calc(100% - 90px)}
.brand .tag{font:400 10px var(--mono);letter-spacing:.18em;color:var(--mag);text-shadow:0 0 6px rgba(255,43,214,.7)}
.brand h1{margin:2px 0 0;font:900 22px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(0,240,255,.55),2px 0 0 rgba(255,43,214,.55),-2px 0 0 rgba(0,240,255,.45)}
.brand h1 span{color:var(--cyan)}
.brand p{margin:5px 0 0;font:400 11px/1.3 var(--mono);letter-spacing:.1em;color:#b8f6ff;text-transform:uppercase;opacity:.85}
#stage.env-overcast .brand h1,#stage.env-overcast .brand p{color:#14181c;text-shadow:none}
.hudbtns{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.ibtn{min-width:44px;height:40px;padding:0 12px;border:1px solid var(--line-strong);background:rgba(4,8,16,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;font:400 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));display:inline-flex;align-items:center;gap:6px}
.ibtn svg{width:16px;height:16px;flex:none}
.ibtn .lb{display:none}
@media (min-width:1360px){.ibtn .lb{display:inline}}
.ibtn[aria-pressed="true"]{background:var(--cyan);color:var(--accent-ink);border-color:var(--cyan);box-shadow:0 0 18px rgba(0,240,255,.5)}
.ibtn:focus-visible,.chip:focus-visible,.tab:focus-visible,.sw:focus-visible,input:focus-visible,.prow:focus-visible{outline:2px solid var(--mag);outline-offset:2px}
#telemetry{position:absolute;left:18px;bottom:16px;font:400 11px/1.55 var(--mono);letter-spacing:.08em;color:#9ff8ff;text-transform:uppercase;pointer-events:none;text-shadow:0 0 6px rgba(0,240,255,.5)}
#telemetry b{color:var(--yel);font-weight:400}
#telemetry .sel{color:var(--mag);max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[hidden]{display:none!important}
#loading,#nogl{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;font:600 13px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);text-align:center;padding:24px;background:rgba(3,4,10,.55)}
#loading .bar{width:min(260px,70vw);height:4px;background:rgba(0,240,255,.15);overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--cyan),var(--mag));animation:ld 1.1s linear infinite}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#toast{position:absolute;left:50%;top:18px;transform:translate(-50%,-220%);opacity:0;transition:transform .3s,opacity .3s;background:rgba(4,8,16,.9);border:1px solid var(--mag);color:#ffd6f6;font:400 12px var(--mono);letter-spacing:.08em;padding:8px 14px;text-transform:uppercase;pointer-events:none;max-width:80%;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
/* ---------- panel */
#sheet{background:linear-gradient(180deg,var(--panel2),var(--panel));border-top:1px solid var(--line-strong);display:flex;flex-direction:column;min-height:0;max-height:48vh;max-height:48dvh;position:relative;box-shadow:0 -8px 30px rgba(0,240,255,.08)}
#sheet::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),var(--mag),transparent)}
.nopanel #sheet{display:none}
#tabs{display:flex;gap:0;overflow-x:auto;padding:0 6px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;padding:13px 11px 10px;cursor:pointer;font:700 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
.tab svg{width:15px;height:15px}
.tab[aria-selected="true"]{color:var(--cyan);border-bottom-color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.6)}
#panes{overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));flex:1;min-height:0;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(0,240,255,.3) transparent}
.pane[hidden]{display:none}
.pane{display:flex;flex-direction:column;gap:16px}
.sec{font:800 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--mag);margin:6px 0 -4px;display:flex;align-items:center;gap:10px;text-shadow:0 0 8px rgba(255,43,214,.5)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,43,214,.5),transparent)}
.grp>label,.grp>.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font:400 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grp .val{color:var(--yel)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--chip);border:1px solid var(--line);padding:8px 12px;min-height:38px;cursor:pointer;font:600 14px var(--body);letter-spacing:.02em;color:var(--text);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px));transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--cyan),#00b8ff);border-color:var(--cyan);color:var(--accent-ink);font-weight:700;box-shadow:0 0 14px rgba(0,240,255,.4)}
.chip small{display:block;font:400 10px var(--mono);letter-spacing:.06em;opacity:.75;margin-top:1px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.sw{display:flex;flex-direction:column;gap:6px;align-items:stretch;background:var(--chip);border:1px solid var(--line);padding:6px;cursor:pointer;text-align:left;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.sw i{display:block;height:26px;border:1px solid rgba(255,255,255,.14)}
.sw span{font:600 12px/1.15 var(--body);color:var(--muted)}
.sw[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan),0 0 12px rgba(0,240,255,.3)}
.sw[aria-pressed="true"] span{color:var(--text)}
.fit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fit .chip{text-align:left;min-height:52px}
input[type=range]{width:100%;accent-color:var(--cyan);height:30px;margin:0}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);background:var(--chip);padding:3px}
input[type=text]{width:100%;height:42px;border:1px solid var(--line-strong);background:#050811;padding:0 12px;font:400 15px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
input[type=text]::placeholder{color:#4d6378}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 0;min-height:40px}
.row span{font:600 15px var(--body)}
.sw-toggle{position:relative;width:50px;height:28px;background:#1a2032;border:1px solid var(--line-strong);cursor:pointer;flex:none;transition:background .2s;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.sw-toggle::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;background:#8aa;transition:transform .2s,background .2s}
.sw-toggle[aria-pressed="true"]{background:rgba(0,240,255,.25);border-color:var(--cyan)}
.sw-toggle[aria-pressed="true"]::after{transform:translateX(22px);background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.specs{width:100%;border-collapse:collapse}
.specs th,.specs td{padding:8px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:baseline}
.specs th{font:400 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:12px;width:42%}
.specs td{font:600 15px var(--body);font-variant-numeric:tabular-nums}
.specs td small{display:block;font:400 10px var(--mono);color:var(--muted);letter-spacing:.04em}
.note{font:500 13px/1.45 var(--body);color:var(--muted);margin:0}
.note a{color:var(--cyan)}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big div{background:var(--chip);border:1px solid var(--line);padding:10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.big b{display:block;font:900 24px/1 var(--display);color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,.5)}
.big small{font:400 10px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
#exitPhoto{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
.photo #sheet,.photo .brand,.photo .hudbtns,.photo #telemetry,.photo .hudframe{display:none}
#app.photo,#app.nopanel{grid-template-rows:minmax(0,1fr)}
.card{background:linear-gradient(135deg,rgba(0,240,255,.07),rgba(255,43,214,.05));border:1px solid var(--line-strong);padding:12px 14px;display:flex;flex-direction:column;gap:8px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.card h3{margin:0;font:800 17px/1.15 var(--display);letter-spacing:.05em;text-transform:uppercase;color:#fff}
.card .desc{margin:0;font:500 15px/1.45 var(--body);color:#cfe4ee}
.pill{align-self:flex-start;font:400 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);background:var(--mag);padding:3px 9px}
.svc{width:100%;border-collapse:collapse;margin-top:2px}
.svc td{padding:5px 0;border-top:1px dashed rgba(0,240,255,.18);font:500 14px var(--body);vertical-align:baseline}
.svc td:first-child{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-right:10px;width:40%}
.svc td b{color:var(--yel);font-weight:600}
.src{font:400 10px var(--mono);color:#5f7488;letter-spacing:.04em}
.rel{margin:4px 0 0}
.plist{display:flex;flex-direction:column;gap:5px}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;background:var(--chip);border:1px solid var(--line);border-left:2px solid rgba(0,240,255,.35);padding:10px 12px;cursor:pointer;min-height:42px}
.prow[aria-pressed="true"]{border-color:var(--cyan);border-left-color:var(--mag);box-shadow:0 0 12px rgba(0,240,255,.25)}
.prow .pn{font:600 15px var(--body)}
.prow .ps{font:400 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:none}
.dot{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--mag);box-shadow:0 0 6px var(--mag)}
#mbar{display:flex;align-items:center;gap:10px;padding:8px 12px 0;flex:none}
#mbar .ml{font:400 10px var(--mono);letter-spacing:.14em;color:var(--mag);text-transform:uppercase}
#mbar button{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,43,214,.08);border:1px solid rgba(255,43,214,.45);color:#ffe1f8;padding:7px 10px;cursor:pointer;font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);min-height:36px;text-align:left}
#mbar button span:last-child{font:400 11px var(--mono);color:var(--mag)}
#picker{position:fixed;inset:0;z-index:50;background:rgba(3,4,10,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;overflow-y:auto}
#picker h2{margin:0;font:900 20px var(--display);letter-spacing:.1em;text-transform:uppercase;color:#fff;text-shadow:0 0 12px rgba(0,240,255,.5)}
#picker .ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
#picker .ptag{font:400 10px var(--mono);letter-spacing:.18em;color:var(--mag)}
#pkCats{margin-bottom:16px}
#pkGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1100px}
.mcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:linear-gradient(135deg,rgba(0,240,255,.08),rgba(255,43,214,.06));border:1px solid var(--line-strong);padding:16px;cursor:pointer;color:var(--text);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));min-height:170px}
.mcard[aria-pressed="true"]{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan),0 0 24px rgba(0,240,255,.25)}
.mcard .mcat{font:400 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mag)}
.mcard b{font:800 18px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase;color:#fff}
.mcard .msub{font:500 14px var(--body);color:var(--muted)}
.mcard .mbad{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.mcard .mbad i{font:400 11px var(--mono);font-style:normal;color:var(--yel);border:1px solid rgba(247,233,74,.35);padding:2px 7px}
.mcard .mgo{font:700 12px var(--display);letter-spacing:.12em;color:var(--cyan);text-transform:uppercase;margin-top:6px}
.jogpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.jogpad .chip{font:800 15px var(--display);min-height:48px;text-align:center}
.tcpread{font:400 13px/1.6 var(--mono);color:#9ff8ff;background:#050811;border:1px solid var(--line);padding:10px 12px;letter-spacing:.06em}
.tcpread b{color:var(--yel);font-weight:400}
.tcpread .w{color:var(--mag)}
.prog{font:400 12px/1.5 var(--mono);background:#050811;border:1px solid var(--line);padding:8px 0;max-height:240px;overflow:auto;white-space:pre}
.prog .pl{padding:1px 10px;color:#b9d4df}
.prog .pl.on{background:var(--cyan);color:var(--accent-ink)}
/* ---------- landscape phones: panel on the right, full height */
@media (orientation:landscape) and (max-height:600px){
  #app{grid-template-columns:minmax(0,1fr) min(44vw,360px);grid-template-rows:minmax(0,1fr)}
  #app.photo,#app.nopanel{grid-template-columns:minmax(0,1fr)}
  #sheet{max-height:none;height:100%;border-top:0;border-left:1px solid var(--line-strong);padding-right:env(safe-area-inset-right,0px)}
  #sheet::before{left:-1px;right:auto;top:0;bottom:0;width:1px;height:auto;background:linear-gradient(180deg,transparent,var(--cyan),var(--mag),transparent)}
  .brand{left:calc(14px + env(safe-area-inset-left,0px));top:10px}
  .brand h1{font-size:16px}.brand p{font-size:9px}.brand .tag{display:none}
  .hudbtns{top:8px;right:8px;gap:6px}
  .ibtn{height:34px;padding:0 9px;font-size:10px}
  .ibtn .lb{display:none}
  #telemetry{left:calc(14px + env(safe-area-inset-left,0px));bottom:8px;font-size:9px;line-height:1.4}
  .tab{padding:10px 9px 8px;font-size:10px}
  #panes{padding:10px 12px 14px}
  .pane{gap:12px}
}
/* ---------- tablets / desktop */
@media (min-width:900px) and (min-height:601px){
  #app{grid-template-columns:minmax(0,1fr) 410px;grid-template-rows:minmax(0,1fr)}
  #app.photo,#app.nopanel{grid-template-columns:minmax(0,1fr)}
  #sheet{max-height:none;height:100%;border-top:0;border-left:1px solid var(--line-strong)}
  #sheet::before{left:-1px;right:auto;top:0;bottom:0;width:1px;height:auto;background:linear-gradient(180deg,transparent,var(--cyan),var(--mag),transparent)}
  .brand h1{font-size:28px}
  .brand{max-width:calc(100% - 290px)}
  .brand p{font-size:12px}
  .hudbtns{flex-direction:row}
  #telemetry{font-size:12px}
}
@media (max-width:380px){.brand h1{font-size:18px}.tab .tl{display:none}.tab{padding:13px 12px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div id="app">
  <div id="stage" class="env-cyber">
    <canvas id="gl" tabindex="0" aria-label="Interactive 3D 2008 Volvo XC70. Drag to orbit, pinch or scroll to zoom, tap a part to scan it."></canvas>
    <div id="veil"></div>
    <div id="scan"></div>
    <div class="hudframe" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
    <div class="brand"><div class="tag">// SYS.ONLINE &middot; NODE XC70</div><h1>Mechanic's <span>Arsenal</span></h1><p>2008 Volvo XC70 3.2 AWD &middot; B6324S I6</p></div>

  var g=clamp((H-B)/0.12,0,1);
  var y2=Math.min(yb+0.12,(yb+B)/2),y3=Math.max(y2+0.01,B-0.05);
  var p1=[0.80*s,yb],p2=[w,y2],p3=[w,y3],p4=[w-0.025,B];
  var p5=[lerp(w-0.16,0.76*s,g),lerp(H,B+(H-B)*0.85,g)];
  var p6=[lerp(w-0.34,0.63*s,g),H];
  var P=function(p,sg){return [x,p[1],p[0]*sg];};
  var cw=p6[0],T=[1,.5,0,-.5,-1].map(function(k){return [x,H+0.025*(1-k*k),cw*k];});
  return {
    BR:[p1,p2,p3,p4].map(function(p){return P(p,1);}),
    CR:[p4,p5,p6].map(function(p){return P(p,1);}),
    T:T,
    CL:[p6,p5,p4].map(function(p){return P(p,-1);}),
    BL:[p4,p3,p2,p1].map(function(p){return P(p,-1);}),
    A:[[x,yb,-p1[0]],[x,yb,0],[x,yb,p1[0]]]
  };
}
function isGlass(nm,j,x){
  if(nm==='CR'||nm==='CL'){if(j!==0)return false;return (x>-0.24&&x<0.60)||(x>-1.36&&x<-0.34)||(x>-2.0&&x<-1.46);}
  if(nm==='T')return x>0.12&&x<0.78;
  return false;
}

    var sc=cp[0],dir=cp[1],ring=[];
    ['BR','CR','T','CL','BL','A'].forEach(function(nm,k){

    ring.forEach(function(r){pos.push(r[0],r[1],r[2]);nor.push(dir,0,0);uv.push(r[2]*1.1,r[1]*1.1);});
    for(var i=0;i<ring.length;i++){

  G.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  G.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  G.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

    g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(buf,o.uv+m.vo*8,m.vn*2),2));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(buf,o.idx+m.io*4,m.in),1));
    g.computeBoundingSphere();return (geos[key]=g);
  }
  function build(pid,c,seat){
    var g=new THREE.Group();
    j.parts[pid].meshes.forEach(function(m,k){
      var mat=m.mat==='interior'?(seat?seatMat:dashMat):MK[m.mat];
      var me=new THREE.Mesh(geoFor(pid+':'+k,m),mat);me.castShadow=(c===car);if(c===mirrorCar)me.renderOrder=-2;g.add(me);
    });
    return g;
  }
  [car,mirrorCar].forEach(function(c){
    c.parts.forEach(function(p){if(p.meta&&KILL[p.meta.id]){p.meta=null;p.o.visible=false;}});
    MP.forEach(function(d){
      if(!j.parts[d.id])return;
      var g=build(d.id,c,d.seat);c.B.add(g);
      c.reg(g,{id:d.id,name:d.name,sys:d.sys,desc:d.desc,tags:d.tags,src:'model'},d.dir);
    });
  });
  MODEL={wheel:function(slot,side,isMirror){
    var g=new THREE.Group(),c=[car,mirrorCar][isMirror?1:0];
    var pid=side>0?'wheelR':'wheelL',cen=j.wheelCentres[['FR','FL','RR','RL'][slot]];
    j.parts[pid].meshes.forEach(function(m,k){var me=new THREE.Mesh(geoFor(pid+':'+k,m),MK[m.mat]);g.add(me);});
    g.rotation.y=side<0?Math.PI:0;g.position.set(0,0,Math.abs(cen[2])-.80);
    return g;
  }};
  [car,mirrorCar].forEach(function(c){
    c.wheels.forEach(function(w){
      var cen=j.wheelCentres[['FR','FL','RR','RL'][w.slot]];
      w.holder.position.y=cen[1];
      c.parts.forEach(function(p){if(p.o===w.holder)p.base.y=cen[1];});
    });
    if(S.wheel===0)c.rebuildWheels(0);
  });
  (function(){
    var P=[[],[]];
    car.B.traverse(function(o){if(o.isMesh&&o.material===fogMat){var a=o.geometry.attributes.position;for(var i=0;i<a.count;i++){var z=a.getZ(i);P[z>0?0:1].push([a.getX(i),a.getY(i),z]);}}});
    P.forEach(function(pts,k){
      if(!pts.length)return;var c=[0,0,0];pts.forEach(function(p){c[0]+=p[0];c[1]+=p[1];c[2]+=p[2];});c=c.map(function(v){return v/pts.length;});
      var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffdca0,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,opacity:0}));
      sp.position.set(c[0]+.06,c[1],c[2]);sp.scale.set(.55,.55,1);sp.renderOrder=20;car.body.add(sp);fogSprites.push(sp);
      var sl=new THREE.SpotLight(0xffdca0,0,9,.7,.8,2);sl.position.set(c[0],c[1],c[2]);var tg=new THREE.Object3D();tg.position.set(c[0]+6,0,c[2]*2.2);car.body.add(tg);sl.target=tg;car.body.add(sl);fogSpots.push(sl);
    });
    syncFog();
  })();
  applyFitment();
  refreshCatalogue();if(MACH==='xc70')buildSysChips();
  $('#loading').hidden=true;
  toast('Arsenal online · '+LIST.length+' parts indexed');
}
/* The model ships as a compact binary (assets/arsenal/model.bin, about 1.1 MB instead of 3.4 MB of base64 in the page):
   positions and UVs as 16-bit steps across their bounding range (under 0.04 mm on the car), normals as 8-bit, indices
   as 16-bit. This rebuilds the float layout mountModel reads, at the offsets the model's JSON names. */
function unpackModel(b,j){
  var dv=new DataView(b);if(dv.getUint32(0,true)!==0x00325241)throw new Error('not an AR2 model');
  var V=dv.getUint32(4,true),I=dv.getUint32(8,true),f=function(o){return dv.getFloat32(o,true);};
  var lo=[f(12),f(16),f(20)],hi=[f(24),f(28),f(32)],ulo=[f(36),f(40)],uhi=[f(44),f(48)],o=52;
  var qp=new Uint16Array(b,o,V*3);o+=V*6;var qn=new Int8Array(b,o,V*3);o+=V*3+(V*3)%2;var qu=new Uint16Array(b,o,V*2);o+=V*4;var qi=new Uint16Array(b,o,I);
  var off=j.off,out=new ArrayBuffer(off.idx+I*4),P=new Float32Array(out,off.pos,V*3),N=new Float32Array(out,off.nor,V*3),U=new Float32Array(out,off.uv,V*2);
  for(var i=0;i<V;i++){var a=i*3,nx=qn[a],ny=qn[a+1],nz=qn[a+2],l=Math.sqrt(nx*nx+ny*ny+nz*nz)||1;
    for(var k=0;k<3;k++)P[a+k]=lo[k]+qp[a+k]/65535*(hi[k]-lo[k]);N[a]=nx/l;N[a+1]=ny/l;N[a+2]=nz/l;
    U[i*2]=ulo[0]+qu[i*2]/65535*(uhi[0]-ulo[0]);U[i*2+1]=ulo[1]+qu[i*2+1]/65535*(uhi[1]-ulo[1]);}
  new Uint32Array(out,off.idx,I).set(qi);return out;
}
Promise.resolve(JSON.parse(document.getElementById('modelJson').textContent)).then(function(j){
  return fetch('assets/arsenal/model.bin').then(function(r){if(!r.ok)throw new Error('model '+r.status);return r.arrayBuffer();}).then(function(b){mountModel(j,unpackModel(b,j));});
}).catch(function(e){console.warn('Model failed to load, using the built-in car',e);$('#loading').hidden=true;});

$('#btnSpin').addEventListener('click',function(){var on=$('#btnSpin').getAttribute('aria-pressed')!=='true';S.auto=on;controls.autoRotate=on;$('#btnSpin').setAttribute('aria-pressed',String(on));var t=$('#tAuto');if(t)t.setAttribute('aria-pressed',String(on));});

document.addEventListener('keydown',function(e){
  var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;
  var k=e.key.toLowerCase();
  if(k==='/'){e.preventDefault();if(app.classList.contains('nopanel'))$('#btnPanel').click();openTab('parts');$('#partSearch').focus();}
  else if(k==='x')$('#btnXray').click();
  else if(k==='e'){var v=EX.tgt>.5?0:1;syncSlider('sExplode',v);}
  else if(k==='l'&&MACH==='xc70')$('#btnLights').click();

});

/* -------------------------------------------------------------- loop */
var baseFov=30;
function fitFov(){camera.fov=camera.aspect<1?Math.min(60,baseFov*1.5):baseFov;camera.updateProjectionMatrix();}
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;fitFov();
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
resize();

setEnv('cyber');
setFinish('metal');setPaint(PAINTS[0].c);
setBulb(1);setCaliper(0);setRotor(0);setTail(0);applyFitment();
setMachine('xc70',true);

var last=performance.now(),first=true,fpsN=0,telT=performance.now(),telEl=$('#telemetry');
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(tween){
    var k=clamp((now-tween.t0)/tween.d,0,1),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0v,tween.t1,e);
    if(k>=1)tween=null;
  }
  EX.cur+=(EX.tgt-EX.cur)*Math.min(1,dt*5);if(Math.abs(EX.tgt-EX.cur)<.0005)EX.cur=EX.tgt;
  [car,mirrorCar].forEach(function(c){c.parts.forEach(function(p){p.o.position.set(p.base.x+p.dir.x*EX.cur,p.base.y+p.dir.y*EX.cur,p.base.z+p.dir.z*EX.cur);});});
  if(MACH==='lrmate')robotUpdate(dt);
  if(PS.box)PS.box.update();
  var st=S.steer*Math.PI/180;
  [car,mirrorCar].forEach(function(c){
    c.wheels.forEach(function(w){
      if(w.front)w.holder.rotation.y=st;
      if(S.spin)w.spin.rotation.z+=w.dir*dt*7.5;
    });
  });
  controls.update();
  renderer.render(scene,camera);
  fpsN++;if(now-telT>400){
    var fps=Math.round(fpsN*1000/(now-telT));fpsN=0;telT=now;
    var off=camera.position.clone().sub(controls.target),r=off.length(),az=(Math.atan2(off.x,off.z)*180/Math.PI+360)%360,elv=Math.asin(clamp(off.y/r,-1,1))*180/Math.PI;
    var pad=function(n,l){n=String(Math.round(n));while(n.length<l)n='0'+n;return n;};
    var sel=PS.sel&&byId[PS.sel]?byId[PS.sel].meta.name:'none';
    if(MACH==='lrmate'&&robot){var w=tcpWorld(),b0=robot.base.getWorldPosition(new THREE.Vector3()),d=w.sub(b0),X=d.x*1000,Y=-d.z*1000,Z=d.y*1000;
      var tr=$('#tcpRead');if(tr)tr.innerHTML='X <b>'+X.toFixed(1)+'</b> &nbsp;Y <b>'+Y.toFixed(1)+'</b> &nbsp;Z <b>'+Z.toFixed(1)+'</b> mm<br>'+RB.q.map(function(v,i){return RVAR[RB.v].J[i]?'J'+uiJ(i)+' <b>'+v.toFixed(1)+'</b>':'';}).filter(Boolean).join(' ')+(RB.warn?'<br><span class="w">&#9888; '+RB.warn+'</span>':'');
      telEl.innerHTML='TCP X <b>'+X.toFixed(0)+'</b> Y <b>'+Y.toFixed(0)+'</b> Z <b>'+Z.toFixed(0)+'</b> MM<br>OVR <b>'+RB.ovr+'%</b> '+(RB.run?'<b>RUN</b> L'+(PR.i+1):'IDLE')+' FPS <b>'+fps+'</b><br><div class="sel">TGT &#9656; '+(PS.sel&&byId[PS.sel]?byId[PS.sel].meta.name:'none')+'</div>';
      if(jogSliders.length&&document.activeElement&&document.activeElement.type!=='range')syncJogUI();
    }else
    telEl.innerHTML='CAM AZ <b>'+pad(az,3)+'&deg;</b> EL <b>'+pad(elv,2)+'&deg;</b> R <b>'+r.toFixed(1)+'M</b><br>EXP <b>'+pad(EX.cur*100,3)+'%</b> XRAY <b>'+pad(S.ghost*100,3)+'%</b> FPS <b>'+fps+'</b><br><div class="sel">TGT &#9656; '+sel.replace(/[<&]/g,'')+'</div>';
  }
  if(first){first=false;$('#ldText').textContent='Streaming XC70 geometry';}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
