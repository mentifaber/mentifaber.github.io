<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e9f8f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilotfish">
<title>Pilotfish</title>
<link rel="manifest" href="/assets/pilotfish.webmanifest">
<link rel="apple-touch-icon" href="/assets/pilotfish-icon-192.png">
<link rel="icon" href="/assets/pilotfish-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f8f9;--card:#fff;--ink:#0f2b3a;--dim:#5f7d8a;--line:#d3eaee;--coral:#0e94ab;--coral2:#7fd0dc;--mint:#24b38a;--sky:#3b7bdc;--plum:#7a5cd6;--sun:#ffb020;--reef:#ff7b6b;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#062330;--card:#0b3242;--ink:#e6f7fa;--dim:#8fb0bc;--line:#14485a;--coral:#2bb6cb}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg) linear-gradient(180deg,rgba(95,208,220,.22),transparent 340px) no-repeat;color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 120px)}
/* login */
.login{min-height:100svh;display:flex;flex-direction:column;justify-content:center;max-width:380px;margin:0 auto;padding:24px 20px}
.brand{font-weight:900;font-size:46px;letter-spacing:-.02em;text-align:center}
.brand span{color:var(--coral)}
.lead{color:var(--dim);text-align:center;margin:6px 0 26px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--dim);margin-bottom:6px}
.inp{width:100%;padding:14px 15px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:16px;outline:none}
.inp:focus{border-color:var(--coral)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--coral);color:#fff;font-weight:900;font-size:17px;box-shadow:0 8px 20px rgba(14,148,171,.3)}
.btn:disabled{opacity:.6}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.err{color:#d6455a;text-align:center;min-height:1.5em;margin-top:12px;font-weight:700;font-size:14px}
/* header */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{font-size:26px;font-weight:900;letter-spacing:-.01em}
.top h1 span{color:var(--coral)}
.hi{color:var(--dim);font-size:14px;font-weight:700}
.sync{font-size:12px;color:var(--dim);text-align:right}
/* store logos */
.logo{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 1px 0 var(--line),0 2px 8px rgba(0,0,0,.06);position:relative}
.logo img{width:30px;height:30px;object-fit:contain}
.logo b{font-weight:900;color:#fff;font-size:18px}
.logo.sm{width:30px;height:30px;border-radius:9px}.logo.sm img{width:20px;height:20px}.logo.sm b{font-size:13px}
.logo.lg{width:60px;height:60px;border-radius:16px}.logo.lg img{width:40px;height:40px}.logo.lg b{font-size:24px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;font-size:11.5px;font-weight:800;text-align:center;line-height:1.15}
.sbtn .logo{width:60px;height:60px;border-radius:18px}.sbtn .logo img{width:40px;height:40px}
.sbtn .n{position:absolute;top:-4px;right:-4px;background:var(--coral);color:#fff;font-size:11px;font-weight:900;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.sbtn.add .logo{background:transparent;border:2px dashed var(--coral2);box-shadow:none;color:var(--coral);font-size:28px;font-weight:900}
.sbtn .logo{overflow:visible}
.sbtn .logo img,.sbtn .logo b{border-radius:12px}
/* list */
.group{background:var(--card);border-radius:20px;padding:6px 14px 6px;margin-bottom:12px;box-shadow:0 2px 12px rgba(80,40,40,.06)}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 0 8px;border-bottom:1px solid var(--line);font-weight:900;font-size:16px}
.ghead .c{margin-left:auto;color:var(--dim);font-size:13px;font-weight:800}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.chk{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--coral2);flex:none;display:grid;place-items:center;color:#fff;font-weight:900;margin-top:1px}
.item.done .chk{background:var(--mint);border-color:var(--mint)}
.item.done .nm{text-decoration:line-through;color:var(--dim)}
.body{flex:1;min-width:0}
.nm{font-weight:800;font-size:16.5px;line-height:1.3;word-wrap:break-word}
.nm .q{color:var(--coral);font-weight:900;margin-left:4px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--dim)}
.tag.when{color:var(--sky)}.tag.how{color:var(--plum)}.tag.who{color:var(--mint)}.tag.late{color:#d6455a}
.note{font-size:13.5px;color:var(--dim);margin-top:4px}
.thumb{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.empty{text-align:center;color:var(--dim);padding:40px 20px;line-height:1.6}
.empty .e{font-size:44px;margin-bottom:8px}
.sec{font-size:13px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--coral);font-weight:900;text-transform:none;letter-spacing:0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:14.5px}
.chip.on{border-color:var(--coral);background:var(--coral);color:#fff}
/* tabs + fab */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 8px calc(var(--safe-b) + 8px);z-index:20}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--dim);padding:4px 6px;flex:1}
.tabs button i{font-style:normal;font-size:22px;filter:grayscale(1);opacity:.6}
.tabs button.on{color:var(--coral)}.tabs button.on i{filter:none;opacity:1}
.fab{position:fixed;right:18px;bottom:calc(var(--safe-b) + 80px);width:62px;height:62px;border-radius:50%;background:var(--coral);color:#fff;font-size:34px;font-weight:700;box-shadow:0 10px 26px rgba(14,148,171,.45);z-index:21;line-height:1}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(30,15,25,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:640px;max-height:92svh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(var(--safe-b) + 22px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:22px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sheet .lbl{font-size:13px;font-weight:900;color:var(--dim);margin:16px 0 8px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.pickstores{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.pickstores button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:800;width:62px;flex:none;padding:6px 0;border-radius:14px;border:2px solid transparent}
.pickstores button.on{border-color:var(--coral);background:var(--card)}
.photo{display:flex;align-items:center;gap:12px;padding:12px;border:2px dashed var(--line);border-radius:16px;font-weight:800;color:var(--dim);width:100%}
.photo img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.actions{display:flex;gap:10px;margin-top:22px}
.danger{color:#d6455a;font-weight:900;padding:12px;display:block;margin:12px auto 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:800;text-align:center;line-height:1.15;padding:8px 2px;border-radius:16px}
.grid button.have{opacity:.4}
.search{margin-bottom:12px}
.bigimg{width:100%;border-radius:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 150px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;border:2px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:800;font-size:14px;color:var(--dim)}
.seg button.on{background:var(--coral);color:#fff}
.mood{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.mood button{background:var(--card);border:2.5px solid var(--line);border-radius:18px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:13.5px}
.mood button i{font-style:normal;font-size:34px;line-height:1}
.mood button.on{border-color:var(--coral);background:rgba(14,148,171,.1);transform:scale(1.03)}
.feel{background:linear-gradient(135deg,rgba(127,208,220,.18),rgba(36,179,138,.10));border:2px solid rgba(14,148,171,.25);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.feel .who{font-size:13px;font-weight:900;color:var(--dim)}
.feel .em{font-size:22px;font-weight:900;margin:4px 0 2px;line-height:1.35}
.feel .txt{font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.feel .ago{font-size:12px;color:var(--dim);font-weight:700;margin-top:6px}
.bell{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:14.5px;width:100%;text-align:left;margin-top:14px}
.hist{font-size:14px;line-height:1.5;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
/* ocean header */
.sea{position:relative;height:30px;margin:2px 0 10px;overflow:hidden}
.sea svg{position:absolute;left:0;bottom:0;width:200%;height:22px;animation:tide 9s linear infinite}
.sea .fin{position:absolute;bottom:9px;font-size:0;animation:swim 14s linear infinite}
.sea .fin svg{position:static;width:30px;height:22px;animation:bob 2.4s ease-in-out infinite}
@keyframes tide{to{transform:translateX(-50%)}}
@keyframes swim{from{left:-40px}to{left:100%}}
@keyframes bob{50%{transform:translateY(2px)}}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.mini button{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:11.5px;line-height:1.15;text-align:center}
.mini button i{font-style:normal;font-size:26px;line-height:1}
.mini button.on{border-color:var(--coral);background:rgba(14,148,171,.12)}
.replies{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.replies button{padding:8px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:13.5px}
.urgent{display:block;width:100%;margin-top:12px;padding:14px;border-radius:16px;border:2.5px solid #e2475f;color:#e2475f;font-weight:900;font-size:16px;background:transparent}
.small{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:6px}
.reply{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-weight:800;border:2px solid var(--line)}
.baby{background:linear-gradient(160deg,#5fd0dc,#0e7f98);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden}
.baby .wk{font-size:34px;font-weight:900;line-height:1}
.baby .sz{font-size:16px;font-weight:800;margin-top:8px;line-height:1.4}
.baby .big{position:absolute;right:14px;top:10px;font-size:58px}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.kick{display:block;width:100%;padding:26px 10px;border-radius:24px;background:var(--card);border:3px dashed var(--coral2);font-weight:900;font-size:18px}
.kick b{display:block;font-size:46px;color:var(--coral)}
.name{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.name:last-child{border-bottom:0}
.name .h{margin-left:auto;font-size:15px;padding:6px 10px;border-radius:999px;border:2px solid var(--line)}
.name .h.on{border-color:var(--reef);color:var(--reef)}
.aisles{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.aisles::-webkit-scrollbar{display:none}
.aisles .chip{flex:none;padding:8px 12px;font-size:13.5px}
.window{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;max-height:46svh;overflow-y:auto;padding:2px 2px 8px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:800;font-size:12.5px;line-height:1.2;text-align:center;min-height:92px}
.tile i{font-style:normal;font-size:30px;line-height:1}
.tile.on{border-color:var(--coral);background:rgba(14,148,171,.10)}
.tile .cnt{position:absolute;top:5px;right:6px;background:var(--coral);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.tile .minus{position:absolute;top:5px;left:6px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:2px solid var(--line);font-style:normal;font-weight:900;display:grid;place-items:center;font-size:15px;line-height:1}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:20px;font-weight:900}
.cal-h button{width:40px;height:40px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:18px;font-weight:900}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);border-radius:20px;padding:10px;box-shadow:0 2px 12px rgba(20,60,80,.06)}
.cal .dow{text-align:center;font-size:11px;font-weight:900;color:var(--dim);padding-bottom:4px}
.cal .d{aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;font-weight:800;font-size:14px;position:relative}
.cal .d.out{opacity:.3}
.cal .d.today{background:rgba(14,148,171,.12);color:var(--coral)}
.cal .d.sel{background:var(--coral);color:#fff}
.cal .d .dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cal .d .dots i{width:6px;height:6px;border-radius:50%;display:block}
.ev{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ev:last-child{border-bottom:0}
.ev .e{font-size:22px;line-height:1.2;width:28px;text-align:center}
.ev .t{font-weight:800;font-size:16px;line-height:1.3}
.ev .s{font-size:12.5px;color:var(--dim);font-weight:700;margin-top:3px}
</style>
</head>
<body>

<!-- sign in -->
<section class="login hidden" id="v-login">
  <div style="font-size:54px;text-align:center">🦈</div>
  <div class="brand">Pilot<span>fish</span></div>
  <p class="lead">A pilot fish swims right beside its shark, all its life.<br>Sign in once on each phone.</p>
  <div class="field"><label for="u">Name</label><input class="inp" id="u" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label for="p">Password</label><input class="inp" id="p" type="password" autocomplete="current-password"></div>
  <button class="btn" id="go">Sign in</button>
  <div class="err" id="lerr"></div>
</section>

<!-- app -->
<div class="wrap hidden" id="v-app">
  <div class="top">
    <div><div class="hi" id="hi"></div><h1>Pilot<span>fish</span></h1></div>
    <div class="sync" id="sync"></div>
  </div>
  <div class="sea" aria-hidden="true"><svg viewBox="0 0 400 22" preserveAspectRatio="none"><path d="M0 12 Q25 4 50 12 T100 12 T150 12 T200 12 T250 12 T300 12 T350 12 T400 12 V22 H0Z" fill="rgba(14,148,171,.22)"/></svg><span class="fin"><svg viewBox="0 0 30 22"><path d="M2 21 C10 19 14 8 22 2 C20 9 21 16 28 21 Z" fill="#0e7f98"/></svg></span></div>
  <div id="page"></div>
</div>
<button class="fab hidden" id="fab" aria-label="Add">+</button>
<nav class="tabs hidden" id="tabs">
  <button data-t="talk" class="on"><i>🦈</i>Talk</button>
  <button data-t="list"><i>📝</i>List</button>
  <button data-t="plan"><i>📅</i>Plan</button>
  <button data-t="cal"><i>📆</i>Calendar</button>
  <button data-t="baby"><i>🍼</i>Baby</button>
</nav>
<div class="sheet hidden" id="sheet"><div class="in" id="sheet-in"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $ = (id) => document.getElementById(id);
const API = "/api/list/listit", IMG = "/api/listimg/listit/";
const NAMES = { anders: "Anders", adrianna: "Adrianna" };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");

/* ── stores we know (logos come from each brand's own site icon) ── */
const PRESETS = [

const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
async function proof(secret) {
  const salt = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("mentifaber-login:listit"));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" }, key, 256));
}

function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? res(b) : rej()), "image/jpeg", .82);
    };
    img.onerror = rej; img.src = url;
  });
}

    '<div class="sec"><span>' + (food ? "Our order" : "On the list") + " (" + its.length + ')</span><button id="q-more">+ with details</button></div>' +
    (its.length ? '<div class="group">' + its.map((i) => itemHTML(i)).join("") + "</div>" : '<div class="empty" style="padding:16px">Tap anything above to add it.</div>') +
    (its.length ? '<div class="sec"><span>Plan the whole trip</span></div><p class="note" style="margin:0 4px 10px">Set the day, how, and who for everything from ' + esc(st.name) + ' at once.</p>' +
      '<div class="row"><input class="inp" type="date" id="t-date"><input class="inp" type="time" id="t-time"></div><div class="chips" id="t-how" style="margin-top:10px">' + HOW.map(([k, l]) => '<button class="chip" data-v="' + k + '">' + l + "</button>").join("") + '</div><div class="chips" id="t-who" style="margin-top:10px">' + WHO.map(([k, l]) => '<button class="chip" data-v="' + k + '">' + l + "</button>").join("") + '</div><button class="btn" id="t-go" style="margin-top:14px">Plan this trip</button>' : "") +
    (food ? "" : '<div class="sec"><span>Store type</span></div><div class="chips" id="w-type">' + STORE_TYPES.filter(([k]) => k !== "food").map(([k, l]) => '<button class="chip' + ((st.cat || KIND_OF[st.name] || "") === k ? " on" : "") + '" data-v="' + k + '">' + l + "</button>").join("") + "</div>") +
    '<button class="danger" id="s-del">Remove ' + esc(st.name) + "</button>", () => {
    scroller.scrollTop = y;
    const grid = () => { $("w-grid").innerHTML = windowGrid(st); };
    $("w-q").oninput = () => { shopQ = $("w-q").value; grid(); [...$("w-aisles").children].forEach((c) => c.classList.toggle("on", !shopQ && c.dataset.aisle === shopAisle)); };
    $("w-q").onkeydown = (e) => { if (e.key === "Enter" && shopQ.trim()) { addFromWindow(sid, shopQ.trim(), 1); toast("Added ✓"); shopQ = ""; storeSheet(sid, true); } };
    $("w-aisles").onclick = (e) => { const b = e.target.closest("[data-aisle]"); if (!b) return; shopAisle = b.dataset.aisle; shopQ = ""; $("w-q").value = ""; grid(); [...$("w-aisles").children].forEach((c) => c.classList.toggle("on", c === b)); };
    $("w-grid").onclick = (e) => {
      const m = e.target.closest("[data-minus]"); if (m) { e.stopPropagation(); addFromWindow(sid, m.dataset.minus, -1); storeSheet(sid, true); return; }
      const t = e.target.closest("[data-add]"); if (!t) return;
      addFromWindow(sid, t.dataset.add, 1); if (navigator.vibrate) navigator.vibrate(12);
      if (shopQ) { shopQ = ""; } storeSheet(sid, true);
    };
    $("q-more").onclick = () => itemSheet(null, sid);
    if ($("w-type")) $("w-type").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; change((d) => { const s2 = d.stores.find((x) => x.id === sid); if (s2) s2.cat = b.dataset.v; }); shopAisle = null; storeSheet(sid); };
    if (its.length) {
      const trip = { how: "", who: "" };
      ["how", "who"].forEach((k) => { $("t-" + k).onclick = (e) => { const b = e.target.closest("button"); if (!b) return; trip[k] = trip[k] === b.dataset.v ? "" : b.dataset.v; [...$("t-" + k).children].forEach((c) => c.classList.toggle("on", c.dataset.v === trip[k])); }; });
      $("t-go").onclick = () => {
        const date = $("t-date").value, time = $("t-time").value;
        change((d) => d.items.forEach((i) => { if (i.store === sid && !i.done) { if (date) i.date = date; if (time) i.time = time; if (trip.how) i.how = trip.how; if (trip.who) i.who = trip.who; } }));
        closeSheet(); toast("Trip planned 📅");
      };
    }
    $("s-del").onclick = () => {
      if (!confirm("Remove " + st.name + "? Its items stay on the list under \"Find it somewhere\".")) return;
      change((d) => { d.stores = d.stores.filter((s) => s.id !== sid); d.items.forEach((i) => { if (i.store === sid) i.store = null; }); });
      closeSheet();
    };
  });
}
function addStoreSheet() {
  sheet('<h2>Add a store</h2><input class="inp search" id="a-q" placeholder="Search, or type a new one…"><div id="a-res"></div>' +
    '<div class="sec"><span>Not here?</span></div><div class="row"><input class="inp" id="a-name" placeholder="Name"><input class="inp" id="a-site" placeholder="website (optional)" autocapitalize="off"></div>' +
    '<div class="lbl">What kind of place?</div><div class="chips" id="a-kind">' + STORE_TYPES.map(([k, l], i) => '<button class="chip' + (i === 0 ? " on" : "") + '" data-v="' + k + '">' + l + "</button>").join("") + '</div><button class="btn" id="a-add" style="margin-top:14px">Add it</button>', () => {
    const have = new Set(doc.stores.map((s) => s.name.toLowerCase()));
    const draw = () => {
      const q = $("a-q").value.trim().toLowerCase();
      $("a-res").innerHTML = PRESETS.map(([cat, list]) => { const l = list.filter(([n]) => !q || n.toLowerCase().includes(q)); return l.length ? '<div class="sec"><span>' + cat + '</span></div><div class="grid">' + l.map(([n, d, c]) => '<button data-p="' + esc(n) + '" class="' + (have.has(n.toLowerCase()) ? "have" : "") + '">' + logoHTML({ name: n, domain: d, color: c }) + esc(n) + "</button>").join("") + "</div>" : ""; }).join("");
      if (q) $("a-name").value = $("a-q").value.trim();
    };
    draw(); $("a-q").oninput = draw;
    $("a-res").onclick = (e) => {
      const b = e.target.closest("button[data-p]"); if (!b) return;
      const p = PRESETS.flatMap((c) => c[1]).find(([n]) => n === b.dataset.p);
      if (have.has(p[0].toLowerCase())) { toast("Already added"); return; }
      change((d) => d.stores.push({ id: uid(), name: p[0], domain: p[1], color: p[2], kind: FOOD.has(p[0]) ? "food" : "store" }));
      have.add(p[0].toLowerCase()); b.classList.add("have"); toast(p[0] + " added ✓");
    };
    let kind = "grocery";
    $("a-kind").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; kind = b.dataset.v; [...$("a-kind").children].forEach((c) => c.classList.toggle("on", c === b)); };
    $("a-add").onclick = () => {
      const n = $("a-name").value.trim(); if (!n) { $("a-name").focus(); return; }
      let site = $("a-site").value.trim().toLowerCase().replace(/^https?:\/\//, "").replace(/^www\./, "").split("/")[0];
      if (site && !/^[a-z0-9.-]+\.[a-z]{2,}$/.test(site)) site = "";
      const colors = ["#ff6f61", "#4f8cff", "#2fbf8f", "#9a5cd6", "#ffb020", "#e05297"];
      change((d) => d.stores.push({ id: uid(), name: n, domain: site, color: colors[n.length % colors.length], kind: kind === "food" ? "food" : "store", cat: kind === "food" ? "" : kind }));
      closeSheet(); toast(n + " added ✓");
    };
  });
}

/* ── clicks ── */
$("page").addEventListener("click", (e) => {
  if (e.target.closest("#m-send")) return sendTalk();
  if (e.target.closest("#m-urgent")) return sendUrgent();
  if (e.target.closest("#m-bell")) return toggleBell();
  const rp = e.target.closest("[data-reply]"); if (rp) return sendReply(rp.dataset.reply, rp.dataset.re);
  if (tab === "baby" && babyClick(e)) return;
  if (tab === "cal" && calClick(e)) return;
  const t = e.target.closest("[data-chk],[data-open],[data-store],[data-addstore],[data-toggledone],[data-cleardone],[data-planwho],[data-feel],[data-need]"); if (!t) return;
  const d = t.dataset;
  if (d.feel) { pickF.has(d.feel) ? pickF.delete(d.feel) : pickF.add(d.feel); t.classList.toggle("on"); return; }
  if (d.need) { pickN.has(d.need) ? pickN.delete(d.need) : pickN.add(d.need); t.classList.toggle("on"); return; }
  if (d.chk) { const id = d.chk; change((x) => { const i = x.items.find((y) => y.id === id); if (i) { i.done = !i.done; i.doneBy = me; } }); return; }
  if (d.open) { const i = doc.items.find((y) => y.id === d.open); if (i) itemSheet(i); return; }
  if (d.store) return storeSheet(d.store);
  if (d.addstore) return addStoreSheet();
  if (d.toggledone !== undefined) { showDone = !showDone; render(); return; }
  if (d.cleardone !== undefined) { const imgs = doc.items.filter((i) => i.done && i.img).map((i) => i.img); imgs.forEach((im) => fetch(IMG + im, { method: "DELETE", credentials: "same-origin" })); change((x) => { x.items = x.items.filter((i) => !i.done); }); toast("Cleared"); return; }
  if (d.planwho) { planWho = d.planwho; render(); }
});
$("sheet-in").addEventListener("click", (e) => {
  const t = e.target.closest("[data-chk],[data-open]"); if (!t) return;
  if (t.dataset.chk) { const id = t.dataset.chk; change((x) => { const i = x.items.find((y) => y.id === id); if (i) { i.done = !i.done; i.doneBy = me; } }); const s = doc.items.find((y) => y.id === id); if (s && s.store) storeSheet(s.store, true); }
  else { const i = doc.items.find((y) => y.id === t.dataset.open); if (i) itemSheet(i); }
});
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo(0, 0); }));
$("fab").onclick = () => (tab === "cal" ? eventSheet(null, calSel) : itemSheet(null));

$("page").addEventListener("input", (e) => { if (e.target.id === "m-note") draft = e.target.value; });
setInterval(() => { if (me && !document.hidden && $("sheet").classList.contains("hidden")) pullMoods().catch(() => {}); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && me) pullMoods().catch(() => {}); });
if (/^#(talk|list|plan|cal|baby)$/.test(location.hash)) tab = location.hash.slice(1);
const boot = () => { pullMoods().catch(() => {}); initPush(); };
pull().then((ok) => (ok ? (showApp(), boot()) : showLogin())).catch(showLogin);
})();
</script>
<script src="/assets/install.js" defer></script>
</body>
</html>
