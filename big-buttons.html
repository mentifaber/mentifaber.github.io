<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Big Buttons</title>
  <meta name="description" content="Four giant buttons — Phone, Search, Talk, YouTube — that you can tap or just say out loud.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      gap: 6px;
      padding: 6px;
      padding-top: max(6px, env(safe-area-inset-top));
      padding-bottom: max(6px, env(safe-area-inset-bottom));
    }

    /* Mic bar: shows what the app is hearing; tap it to start / stop listening */
    #mic {
      flex: 0 0 auto;
      min-height: 13vh;
      min-height: 13dvh;
      border: 5px solid #fff;
      border-radius: 18px;
      background: #222;
      color: #fff;
      font: inherit;
      font-size: clamp(1.1rem, 6vw, 3rem);
      line-height: 1.1;
      padding: 8px 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
    }

    #mic .dot {
      flex: 0 0 auto;
      width: 0.8em;
      height: 0.8em;
      border-radius: 50%;
      background: #666;
    }

    #mic.listening { background: #3a0000; border-color: #ff3333; }
    #mic.listening .dot {
      background: #ff2222;
      animation: pulse 1s ease-in-out infinite;
    }
    #mic.heard { background: #ffee00; color: #000; border-color: #ffee00; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.6; }
    }

    .big {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      border: 6px solid #fff;
      border-radius: 22px;
      color: #fff;
      font: inherit;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
      transition: transform 0.1s, filter 0.1s;
    }

    .big:active, .big.flash {
      transform: scale(0.97);
      filter: brightness(1.4);
    }

    .big:focus-visible {
      outline: 8px solid #ffff00;
      outline-offset: -14px;
    }

    #phone   { background: #0055ee; }
    #search  { background: #009933; }
    #talk    { background: #cc0000; }
    #youtube { background: #ff5500; }
  </style>
</head>
<body>
  <main class="app">
    <button id="mic" type="button" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span id="micText">TAP HERE, THEN SPEAK</span>
    </button>
    <button class="big" id="phone" type="button" aria-label="Phone – make a call"><span>PHONE</span></button>
    <button class="big" id="search" type="button" aria-label="Search – open Google"><span>SEARCH</span></button>
    <button class="big" id="talk" type="button" aria-label="Talk – open Mentifaber Talk"><span>TALK</span></button>
    <button class="big" id="youtube" type="button" aria-label="YouTube – open YouTube"><span>YOUTUBE</span></button>
  </main>

  <script>
    const LINKS = {
      phone: 'tel:',
      search: 'https://www.google.com',
      talk: 'https://mentifaber.org/talk',
      youtube: 'https://www.youtube.com'
    };

    const mic = document.getElementById('mic');
    const micText = document.getElementById('micText');
    const bigButtons = [...document.querySelectorAll('.big')];

    /* ---------- Make each word as wide as the screen ---------- */
    function fitText() {
      bigButtons.forEach(btn => {
        const span = btn.firstElementChild;
        span.style.fontSize = '100px';
        const maxW = btn.clientWidth * 0.94;
        const maxH = btn.clientHeight * 0.9;
        const w = span.scrollWidth || 1;
        const h = span.offsetHeight || 1;
        const size = Math.min(100 * maxW / w, 100 * maxH / h);
        span.style.fontSize = Math.floor(size) + 'px';
      });
    }
    window.addEventListener('resize', fitText);
    window.addEventListener('orientationchange', () => setTimeout(fitText, 200));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);
    fitText();

    /* ---------- Talking back ---------- */
    function speak(text, done) {
      let finished = false;
      const finish = () => { if (!finished) { finished = true; if (done) done(); } };
      if (!('speechSynthesis' in window)) { finish(); return; }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1;
      u.onend = finish;
      u.onerror = finish;
      speechSynthesis.speak(u);
      // Some phones never fire onend — don't get stuck waiting
      setTimeout(finish, 2500);
    }

    function setMic(text, mode) {
      micText.textContent = text;
      mic.classList.remove('listening', 'heard');
      if (mode) mic.classList.add(mode);
    }

    /* ---------- Going places ---------- */
    let leaving = false;
    function go(url, sayText, btnId) {
      if (leaving) return;
      leaving = true;
      stopListening();
      if (btnId) document.getElementById(btnId).classList.add('flash');
      setMic(sayText.toUpperCase(), 'heard');
      speak(sayText, () => { window.location.href = url; });
      // In case the browser blocks navigation, let the app work again
      setTimeout(() => {
        leaving = false;
        bigButtons.forEach(b => b.classList.remove('flash'));
      }, 4000);
    }

    // Taps go straight there
    bigButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const names = { phone: 'Phone', search: 'Google', talk: 'Talk', youtube: 'YouTube' };
        go(LINKS[btn.id], 'Opening ' + names[btn.id], btn.id);
      });
    });

    /* ---------- Voice commands ---------- */
    const NUMBER_WORDS = {
      zero: '0', oh: '0', o: '0', one: '1', two: '2', to: '2', too: '2', three: '3',
      four: '4', for: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9'
    };

    function digitsFrom(text) {
      return text.split(/\s+/)
        .map(w => NUMBER_WORDS[w] !== undefined ? NUMBER_WORDS[w] : w.replace(/[^0-9+]/g, ''))
        .join('');
    }

    let waitingFor = null; // 'search' | 'youtube' when the app asked "what for?"

    function handle(raw) {
      const text = raw.toLowerCase().trim().replace(/[.,!?]/g, '');
      if (!text) return;

      // Follow-up answer to "What do you want to search?"
      if (waitingFor) {
        const kind = waitingFor;
        waitingFor = null;
        if (/^(cancel|stop|never ?mind|nothing)$/.test(text)) {
          setMic('OK, CANCELLED', 'heard');
          speak('Okay');
          return;
        }
        return kind === 'search' ? searchGoogle(text) : searchYouTube(text);
      }

      let m;

      // PHONE: "phone", "call", "dial", "call 555 1234"
      if ((m = text.match(/^(?:phone|call|dial|make a call)(?:\s+(.*))?$/)) || /\bphone\b/.test(text)) {
        const digits = m && m[1] ? digitsFrom(m[1]) : '';
        if (digits.length >= 3) return go('tel:' + digits, 'Calling ' + digits.split('').join(' '), 'phone');
        return go(LINKS.phone, 'Opening phone', 'phone');
      }

      // YOUTUBE: "youtube", "youtube cat videos", "play some music"
      if ((m = text.match(/^(?:you ?tube|play)(?:\s+(.*))?$/)) || /\byou ?tube\b/.test(text)) {
        const q = m && m[1] ? m[1].replace(/^(?:for|search(?: for)?)\s+/, '') : '';
        if (q) return searchYouTube(q);
        return go(LINKS.youtube, 'Opening YouTube', 'youtube');
      }

      // TALK
      if (/\btalk\b/.test(text)) {
        return go(LINKS.talk, 'Opening Talk', 'talk');
      }

      // SEARCH: "search", "google", "search for pizza near me", "look up the weather"
      if ((m = text.match(/^(?:search|google|look up|find)(?:\s+(?:for\s+)?(.*))?$/)) || /\b(search|google)\b/.test(text)) {
        const q = m && m[1] ? m[1] : '';
        if (q) return searchGoogle(q);
        waitingFor = 'search';
        setMic('SEARCH FOR WHAT?', 'heard');
        speak('What do you want to search for?');
        return;
      }

      setMic('SAY: PHONE · SEARCH · TALK · YOUTUBE', 'heard');
      speak('Say phone, search, talk, or YouTube');
    }

    function searchGoogle(q) {
      go('https://www.google.com/search?q=' + encodeURIComponent(q), 'Searching for ' + q, 'search');
    }

    function searchYouTube(q) {
      go('https://www.youtube.com/results?search_query=' + encodeURIComponent(q), 'YouTube, ' + q, 'youtube');
    }

    /* ---------- Speech recognition ---------- */
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null;
    let wantListening = false;
    let running = false;

    if (!Recognition) {
      setMic('VOICE NOT SUPPORTED HERE — TAP A BUTTON', null);
    } else {
      rec = new Recognition();
      rec.lang = navigator.language || 'en-US';
      rec.continuous = true;
      rec.interimResults = true;
      rec.maxAlternatives = 1;

      rec.onstart = () => {
        running = true;
        if (!waitingFor) setMic('LISTENING… SAY A BUTTON', 'listening');
      };

      rec.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const r = e.results[i];
          const said = r[0].transcript;
          if (r.isFinal) {
            handle(said);
          } else {
            setMic('“' + said.trim().toUpperCase() + '”', 'listening');
          }
        }
      };

      rec.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          wantListening = false;
          setMic('ALLOW THE MICROPHONE, THEN TAP HERE', null);
        }
      };

      rec.onend = () => {
        running = false;
        // Keep listening until told to stop (phones cut off after silence)
        if (wantListening && !leaving) {
          setTimeout(startListening, 250);
        } else if (!leaving && !wantListening && mic.classList.contains('listening')) {
          setMic('TAP HERE, THEN SPEAK', null);
        }
      };
    }

    function startListening() {
      if (!rec || running) return;
      wantListening = true;
      try { rec.start(); } catch (err) { /* already started */ }
    }

    function stopListening() {
      wantListening = false;
      if (rec && running) { try { rec.stop(); } catch (err) {} }
    }

    mic.addEventListener('click', () => {
      if (!rec) {
        speak('Voice is not supported in this browser. Tap a button instead.');
        return;
      }
      if (wantListening) {
        stopListening();
        setMic('TAP HERE, THEN SPEAK', null);
      } else {
        speak('Say phone, search, talk, or YouTube', startListening);
      }
    });

    // Start listening right away if the mic is already allowed
    if (rec && navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' })
        .then(p => { if (p.state === 'granted') startListening(); })
        .catch(() => {});
    }

    // Coming back with the Back button: reset and listen again
    window.addEventListener('pageshow', (e) => {
      leaving = false;
      bigButtons.forEach(b => b.classList.remove('flash'));
      fitText();
      if (e.persisted && rec) startListening();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopListening();
      else if (rec && !leaving && navigator.permissions) {
        navigator.permissions.query({ name: 'microphone' })
          .then(p => { if (p.state === 'granted') startListening(); })
          .catch(() => {});
      }
    });
  </script>
</body>
</html>
