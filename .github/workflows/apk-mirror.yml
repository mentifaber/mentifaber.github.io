name: Mirror APKs to R2

# Copies every app's current release-signed build (<file>.apk and <file>.json) from its GitHub release to R2, under
# apk/<release>/<file> in the mentifaber-models bucket, which is what mentifaber.org serves (src/store.js). New builds are
# mirrored by android.yml as they publish; this catches up the ones published before that. Runs when this file changes on
# main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/apk-mirror.yml"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Copy each release to R2
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=0; skip=0; fail=0
          while read -r TAG FILE; do
            rm -rf dl && mkdir dl
            if ! gh release download "$TAG" -D dl -p "$FILE.apk" -p "$FILE.json" 2>/dev/null || [ ! -s "dl/$FILE.apk" ] || [ ! -s "dl/$FILE.json" ]; then
              echo "- $TAG/$FILE: no published build, skipped" >> "$GITHUB_STEP_SUMMARY"; skip=$((skip+1)); continue; fi
            if [ "$(jq -r .signed "dl/$FILE.json")" != release ]; then echo "- $TAG/$FILE: test-key build, skipped" >> "$GITHUB_STEP_SUMMARY"; skip=$((skip+1)); continue; fi
            if npx -y wrangler@4 r2 object put "mentifaber-models/apk/$TAG/$FILE.apk" --file "dl/$FILE.apk" --content-type application/vnd.android.package-archive --remote \
              && npx -y wrangler@4 r2 object put "mentifaber-models/apk/$TAG/$FILE.json" --file "dl/$FILE.json" --content-type application/json --remote; then
              echo "- $TAG/$FILE: mirrored ($(stat -c %s "dl/$FILE.apk") bytes)" >> "$GITHUB_STEP_SUMMARY"; ok=$((ok+1))
            else echo "- $TAG/$FILE: **upload failed**" >> "$GITHUB_STEP_SUMMARY"; fail=$((fail+1)); fi
          done < <(jq -r '.apps[] | select(.release and .file and .status != "soon") | .release + " " + .file' android/apps.json)
          echo "Mirrored $ok, skipped $skip, failed $fail" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$fail" = 0 ]
      - name: Check that the live store serves from R2
        # the catalog must point every installable app at mentifaber.org, and one real download must match its checksum
        run: |
          get() { for k in 1 2 3 4; do curl -fsSL -A "Mentifaber store check" "$1" -o "$2" && return 0; sleep $((k * 10)); done; return 1; }
          get https://mentifaber.org/store/catalog.json cat.json && jq -e .apps cat.json >/dev/null || { echo "::error::couldn't read the live catalog"; exit 1; }
          R2=$(jq '[.apps[] | select(.available and (.apk | startswith("https://mentifaber.org/")))] | length' cat.json)
          GH=$(jq '[.apps[] | select(.available and (.apk | startswith("https://mentifaber.org/") | not))] | length' cat.json)
          echo "Live catalog: $R2 installable apps served from mentifaber.org, $GH from elsewhere" | tee -a "$GITHUB_STEP_SUMMARY"
          A=$(jq -c '.apps[] | select(.id == "org.mentifaber.store")' cat.json)
          get "$(jq -r .apk <<<"$A")" foundry.apk || { echo "::error::Foundry's APK didn't download"; exit 1; }
          if [ "$(sha256sum foundry.apk | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$A")" ]; then echo "Foundry's APK downloads from $(jq -r .apk <<<"$A") and matches its checksum" | tee -a "$GITHUB_STEP_SUMMARY"
          else echo "::error::Foundry's APK doesn't match the catalog's checksum"; exit 1; fi
          [ "$GH" = 0 ] || { echo "::error::$GH apps still download from outside mentifaber.org"; exit 1; }
