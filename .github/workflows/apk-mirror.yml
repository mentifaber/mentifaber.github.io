name: Mirror APKs to R2

# Copies every app's current release-signed build (<file>.apk and <file>.json) from its GitHub release to R2, under
# apk/<release>/<file> in the mentifaber-models bucket, which is what mentifaber.org serves (src/store.js). New builds are
# mirrored by android.yml as they publish; this catches up the ones published before that. Runs when this file changes on
# main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/apk-mirror.yml"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Copy each release to R2
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ok=0; skip=0; fail=0
          while read -r TAG FILE; do
            rm -rf dl && mkdir dl
            if ! gh release download "$TAG" -D dl -p "$FILE.apk" -p "$FILE.json" 2>/dev/null || [ ! -s "dl/$FILE.apk" ] || [ ! -s "dl/$FILE.json" ]; then
              echo "- $TAG/$FILE: no published build, skipped" >> "$GITHUB_STEP_SUMMARY"; skip=$((skip+1)); continue; fi
            if [ "$(jq -r .signed "dl/$FILE.json")" != release ]; then echo "- $TAG/$FILE: test-key build, skipped" >> "$GITHUB_STEP_SUMMARY"; skip=$((skip+1)); continue; fi
            if npx -y wrangler@4 r2 object put "mentifaber-models/apk/$TAG/$FILE.apk" --file "dl/$FILE.apk" --content-type application/vnd.android.package-archive --remote \
              && npx -y wrangler@4 r2 object put "mentifaber-models/apk/$TAG/$FILE.json" --file "dl/$FILE.json" --content-type application/json --remote; then
              echo "- $TAG/$FILE: mirrored ($(stat -c %s "dl/$FILE.apk") bytes)" >> "$GITHUB_STEP_SUMMARY"; ok=$((ok+1))
            else echo "- $TAG/$FILE: **upload failed**" >> "$GITHUB_STEP_SUMMARY"; fail=$((fail+1)); fi
          done < <(jq -r '.apps[] | select(.release and .file and .status != "soon") | .release + " " + .file' android/apps.json)
          echo "Mirrored $ok, skipped $skip, failed $fail" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$fail" = 0 ]
