# Temporary: checks quotes through the deployed Worker (removed after the run).
name: Quote probe
on:
  push:
    branches: [claude/website-redesign-portfolio-9dci67]
    paths: [.github/workflows/quote-probe.yml, .github/probe/quote.mjs]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/probe/quote.mjs
