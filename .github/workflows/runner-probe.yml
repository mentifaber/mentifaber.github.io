# Temporary: runs a Python result through Hive's runner (Pyodide from its CDN) in a real browser (removed after the run).
name: Runner probe
on:
  push:
    branches: [claude/website-redesign-portfolio-9dci67]
    paths: [.github/workflows/runner-probe.yml, .github/probe/pyrun.*]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: (python3 -m http.server 8099 >/dev/null 2>&1 &) && sleep 1 && cp .github/probe/pyrun.mjs ./pyrun.mjs && node pyrun.mjs
