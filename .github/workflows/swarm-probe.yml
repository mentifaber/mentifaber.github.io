name: Swarm probe
on:
  push:
    branches: [claude/website-redesign-portfolio-9dci67]
    paths: [.github/workflows/swarm-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read the latest missions' feeds
        run: |
          B=https://mentifaber-1.sonicnomad01.workers.dev/api/hive
          curl -sS "$B/list" -o list.json
          node -e '
            const l = require("./list.json"); const ps = (l.projects || []).slice(0, 8);
            for (const p of ps) console.log(p.id, "|", p.status, "|", p.title, "|", p.calls, "|", p.ts && new Date(p.ts).toISOString());
            require("fs").writeFileSync("ids.txt", ps.slice(0, 4).map((p) => p.id).join("\n"));'
          for id in $(cat ids.txt); do
            curl -sS "$B/state?id=$id" -o s.json
            node -e '
              const s = require("./s.json"), p = s.project || {};
              console.log("\n==== " + p.title + " [" + p.status + "] calls " + p.calls + "/" + p.max + " final " + (p.final || "").length + " chars; versions " + (p.versions || []).length);
              console.log("final head: " + JSON.stringify((p.final || "").slice(0, 300)));
              console.log("AGENTS:"); for (const a of s.agents || []) console.log("  " + a.name + " | " + a.src + " | " + a.model + " | " + a.status + " | score " + a.score + " | done " + a.done + " | roles " + a.roles + (a.err ? " | ERR " + a.err : ""));
              console.log("TASKS:"); for (const t of s.tasks || []) console.log("  #" + t.id + " " + t.role + " " + t.status + " n=" + t.n + " tries=" + t.tries + " " + t.title + (t.note ? " | " + t.note.slice(0, 160) : ""));
              console.log("FEED (newest first):"); for (const f of (s.feed || []).slice(0, 60)) console.log("  " + new Date(f.ts).toISOString().slice(11, 19) + " " + f.who + " [" + f.kind + "] " + String(f.text).slice(0, 260));'
          done
