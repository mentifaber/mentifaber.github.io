name: AutoFaber stream capture

# Records real reply streams (tools/capture-streams.mjs): Workers AI's raw stream with the deploy's Cloudflare credentials,
# and what a visitor's browser receives from mentifaber.org. The summary is on the run's page; the raw captures are
# attached to the run as an artifact for 30 days. Runs when the script or this file changes on main, or by hand.
on:
  workflow_dispatch:
    inputs:
      layer:
        description: "provider, site or both"
        default: both
      reps:
        description: "Runs per case (each fault is reported as a rate)"
        default: "2"
  push:
    branches: [main]
    paths: ["tools/capture-streams.mjs", ".github/workflows/capture.yml"]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tools/capture-streams.mjs --layer "${LAYER:-both}" --reps "${REPS:-2}" --out captures
        env:
          LAYER: ${{ github.event.inputs.layer }}
          REPS: ${{ github.event.inputs.reps }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autofaber-captures
          path: captures
          retention-days: 30
