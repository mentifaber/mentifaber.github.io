name: Tests

# Genesis's server tests (its Durable Object under Node) and browser tests (the app in Chromium), on every PR and push to main.
# (A branch's pushes are tested through its PR, so each push runs once: Actions minutes count on a private repository.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # pinned: Playwright 1.56 can't install Chromium's system libraries on ubuntu-latest (now 26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run the tests
        env:
          PLAYWRIGHT: /tmp/pw/node_modules/playwright
        run: tests/run.sh
